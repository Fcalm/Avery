<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avery 本地投递测试站</title>
<style>body{font-family:system-ui,sans-serif;margin:0 auto;max-width:900px;padding:24px}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:6px}article{border:1px solid #bbb;margin:10px 0;padding:12px}fieldset{margin:16px 0}[hidden]{display:none!important}</style></head>
<body><main><h1>岗位测试站</h1>
<section><h2>搜索岗位</h2><label>岗位关键词 <input id="keyword" autocomplete="off"></label><button id="search" type="button">搜索岗位</button><p id="result-count" aria-live="polite">尚未搜索</p><div id="results"></div></section>
<section id="job-detail" hidden><h2 id="job-title"></h2><p id="job-meta"></p><p id="job-description"></p><button id="start-application" type="button">申请这个岗位</button></section>
<form id="application" hidden><h2>申请表</h2>
<label>姓名 <input name="name" required></label><label>邮箱 <input name="email" type="email" required></label><label>手机号 <input name="phone" required></label><label>自我介绍 <textarea name="intro" required></textarea></label>
<label>工作方式 <select name="workMode" required><option value="">请选择</option><option value="onsite">坐班</option><option value="hybrid">混合办公</option><option value="remote">远程</option></select></label>
<fieldset><legend>当前所在地</legend><label>省份/直辖市 <select id="province" name="province" required><option value="">请选择</option></select></label><label>城市 <select id="city" name="city" required disabled><option value="">请先选择省份</option></select></label></fieldset>
<fieldset><legend>求职方向</legend><label>职类 <select id="job-family" name="jobFamily" required><option value="">请选择</option></select></label><label>具体方向 <select id="job-track" name="jobTrack" required disabled><option value="">请先选择职类</option></select></label></fieldset>
<label>简历文件 <input name="resume" type="file" accept=".pdf,.doc,.docx,.txt" required></label><label><input name="terms" type="checkbox" required> 同意申请条款</label><button type="submit">提交申请</button></form>
<section id="success" hidden aria-live="polite"><h2>申请成功</h2><p id="receipt"></p></section></main>
<script>
const jobs=[{id:'agent-platform',title:'Agent 平台工程师',location:'北京',family:'平台研发',type:'全职',description:'负责工具编排、上下文管理、浏览器自动化与安全验证。'},{id:'llm-app',title:'大模型应用工程师',location:'上海',family:'AI 应用',type:'全职',description:'负责 RAG、模型评估与应用交付。'},{id:'frontend',title:'前端工程师',location:'杭州',family:'Web',type:'全职',description:'负责桌面端和 Web 交互体验。'},{id:'analyst',title:'数据分析师',location:'深圳',family:'数据',type:'全职',description:'负责业务分析与指标体系。'},{id:'pm',title:'产品经理',location:'北京',family:'产品',type:'全职',description:'负责求职产品规划与验证。'},{id:'nlp-intern',title:'NLP 实习生',location:'上海',family:'算法',type:'实习',description:'参与文本理解与评测数据建设。'}];
const locations={北京:['北京市'],上海:['上海市'],浙江:['杭州','宁波'],广东:['深圳','广州']};const tracks={技术:['Agent 工程','前端开发','数据工程'],产品:['产品经理','产品运营']};let selectedJob=null;
function populate(child,values,emptyText){child.innerHTML=`<option value="">${emptyText}</option>`+values.map(value=>`<option value="${value}">${value}</option>`).join('');child.disabled=values.length===0}
populate(document.querySelector('#province'),Object.keys(locations),'请选择');populate(document.querySelector('#job-family'),Object.keys(tracks),'请选择');document.querySelector('#province').addEventListener('change',event=>populate(document.querySelector('#city'),locations[event.target.value]||[],'请选择城市'));document.querySelector('#job-family').addEventListener('change',event=>populate(document.querySelector('#job-track'),tracks[event.target.value]||[],'请选择方向'));
document.querySelector('#search').addEventListener('click',()=>{const keyword=document.querySelector('#keyword').value.trim().toLowerCase();const matches=jobs.filter(job=>`${job.title} ${job.location} ${job.family} ${job.type}`.toLowerCase().includes(keyword));document.querySelector('#result-count').textContent=`找到 ${matches.length} 个岗位`;document.querySelector('#results').innerHTML=matches.map(job=>`<article><h3>${job.title}</h3><p>${job.location} · ${job.family} · ${job.type}</p><button type="button" data-job="${job.id}">查看 ${job.title} JD</button></article>`).join('')});
document.querySelector('#results').addEventListener('click',event=>{const id=event.target instanceof HTMLElement?event.target.dataset.job:'';if(!id)return;selectedJob=jobs.find(job=>job.id===id);document.querySelector('#job-title').textContent=`${selectedJob.title} JD`;document.querySelector('#job-meta').textContent=`${selectedJob.location} · ${selectedJob.family} · ${selectedJob.type}`;document.querySelector('#job-description').textContent=selectedJob.description;document.querySelector('#job-detail').hidden=false});document.querySelector('#start-application').addEventListener('click',()=>{document.querySelector('#application').hidden=false});
document.querySelector('#application').addEventListener('submit',async event=>{event.preventDefault();if(!selectedJob||!event.currentTarget.reportValidity())return;const data=new FormData(event.currentTarget);const resume=data.get('resume');const response=await fetch('/__test/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jobId:selectedJob.id,name:data.get('name'),email:data.get('email'),phone:data.get('phone'),intro:data.get('intro'),workMode:data.get('workMode'),province:data.get('province'),city:data.get('city'),jobFamily:data.get('jobFamily'),jobTrack:data.get('jobTrack'),resumeName:resume instanceof File?resume.name:'',terms:data.get('terms')==='on'})});const result=await response.json();document.querySelector('#success').hidden=false;document.querySelector('#receipt').textContent=result.receipt?`投递回执 ${result.receipt}`:result.message});
</script></body></html>
