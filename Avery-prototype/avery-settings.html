/* 模型列表 label, with the fetch button riding beside the text */
.lb-row{display:flex;align-items:center;gap:5px}
.lb-row .lb{font-size:12.5px;font-weight:550;color:var(--text-2);padding-left:1px}
.lb-get{margin-left:1px;color:var(--text-3)}
.lb-get:hover{color:var(--text)}
.lb-get.spin i.ph{animation:spin .6s var(--ease)}

/* checkbox chips in the model dialog */
.chk-row{display:flex;flex-wrap:wrap;gap:9px}
.chk{
  position:relative;display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 14px;
  border:1px solid var(--border-2);border-radius:var(--r-control);background:var(--panel);
  font-size:13.5px;font-weight:500;color:var(--text);
  transition:border-color .16s var(--ease), background-color .3s var(--ease);
}
.chk input{position:absolute;width:0;height:0;margin:0;opacity:0}
.chk .box{
  width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:5px;
  border:1px solid var(--border-2);background:var(--panel);color:transparent;font-size:11px;
  transition:background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
}
.chk input:checked + .box{background:var(--text);border-color:var(--text);color:var(--bg)}
.chk:hover{border-color:var(--text-3)}
.chk.locked{cursor:default}
.chk.locked:hover{border-color:var(--border-2)}
.chk .lock{font-size:12px;color:var(--text-3)}
.chk:has(input:focus-visible) .box{outline:2px solid var(--accent);outline-offset:2px}

/* model config dialog */
.modal{
  position:fixed;left:50%;top:50%;z-index:61;width:min(620px,92vw);max-height:calc(100dvh - 60px);
  display:flex;flex-direction:column;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translate(-50%,calc(-50% + 12px)) scale(.985);
  transition:opacity .22s var(--ease), transform .32s var(--ease), visibility 0s linear .32s,
             background-color .3s var(--ease), border-color .3s var(--ease);
}
.modal.show{
  opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1);
  transition:opacity .22s var(--ease), transform .32s var(--ease), visibility 0s,
             background-color .3s var(--ease), border-color .3s var(--ease);
}
.md-head{display:flex;align-items:center;gap:12px;padding:20px 18px 2px 22px}
.md-title{font-size:17px;font-weight:660;letter-spacing:-.015em}
.md-x{margin-left:auto;color:var(--text-3)}
.md-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:18px 22px 4px}
.md-body::-webkit-scrollbar{width:10px}
.md-body::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.md-body:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}
.md-body .lb{font-size:13px}
.md-foot{display:flex;justify-content:flex-end;gap:9px;padding:22px 22px 20px}
.md-foot .ghost-btn,.md-foot .btn-accent{height:36px;padding:0 18px;font-size:13.5px}
.set-inp.bad{border-color:#b4413c}
.set-inp.bad:focus{box-shadow:0 0 0 3px rgba(180,65,60,.12)}
[data-theme="dark"] .set-inp.bad{border-color:#e0796f}

/* ---------------------------------------------------------------------- 常规
   A plain list in the same card idiom: label and a short description on the
   left, the control on the right, one hairline between rows. The group heading
   is the only banded strip, so the sections read at a glance. */
.gn{padding:34px 30px 46px;max-width:1120px;margin:0 auto}
/* the head and the card share one measure, so the h1 lines up with the h1 on
   模型设置 and the header action lines up with the card's right edge */
.gn .set-head{max-width:860px}
.gn-card{
  max-width:860px;margin-top:20px;overflow:hidden;
  border:1px solid var(--border);border-radius:var(--r-card);background:var(--raised);
  transition:background-color .3s var(--ease), border-color .3s var(--ease);
}
.gn-cap{
  padding:18px 20px 7px;background:var(--surface);
  font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-3);
}
.gn-row{display:flex;align-items:center;gap:26px;padding:15px 20px}
.gn-row + .gn-row{border-top:1px solid var(--border)}
.gn-row.stack{flex-direction:column;align-items:stretch;gap:12px}
.gn-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gn-t{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.gn-d{font-size:12.5px;color:var(--text-3);line-height:1.55}
/* the folder path sits inline after its label, drawn as text rather than as a
   filled control: there is nothing to type into it, only a folder to pick */
.gn-line{display:flex;align-items:baseline;gap:10px;min-width:0}
.gn-path{
  min-width:0;font-family:var(--font-data);font-size:12.5px;color:var(--text-2);
  overflow-wrap:anywhere;
}
.gn-ctl{flex:none;display:flex;align-items:center;gap:8px}
.gn-reset{margin-left:auto;flex:none}

.gn-sel{width:190px;height:36px;padding:0 11px;font-size:13px}
.gn-sel .chev{font-size:11px}
/* anchored to the right of the select so it stays inside the card; the
   .menu.drop defaults are more specific, so they have to be named too */
.menu.drop.gn-menu{left:auto;right:0;width:224px;transform-origin:top right}
/* a menu on the card's last row has nowhere to drop to: the card clips it, so
   it opens upward instead */
.menu.drop.gn-menu.up{
  top:auto;bottom:calc(100% + 7px);
  transform-origin:bottom right;transform:translateY(6px) scale(.97);
}
.menu.drop.gn-menu.up.open{transform:none}

/* the account menu's switch, reused standalone in a settings row */
.switch.on{background:var(--accent)}
.switch.on .knob{transform:translateX(14px)}
.switch[aria-disabled="true"]{opacity:.45;cursor:default}
.gn-ctl .switch:not([aria-disabled="true"]):hover{box-shadow:0 0 0 3px var(--accent-soft)}
.quiet-btn.spin i.ph{animation:spin .6s var(--ease)}

/* ------------------------------------------------------------- 浏览器控制
   Same list idiom as 常规. Three things are new here: a status pill that can
   say 检测中, a banded note under a heading, and a destructive pair. */
.pill.busy{gap:6px;padding:0 11px}
.pill.busy i.ph{font-size:13px;animation:spin .8s linear infinite}

/* a note that belongs to the heading above it, so the band stays one piece */
.bw-hint{
  display:flex;align-items:flex-start;gap:7px;
  padding:0 20px 13px;background:var(--surface);
  font-size:12.5px;color:var(--text-3);line-height:1.5;
}
.bw-hint i.ph{font-size:14px;flex:none;margin-top:2px}

.quiet-btn[aria-disabled="true"]{opacity:.5;cursor:default}
.quiet-btn[aria-disabled="true"]:hover{background:var(--surface-2);color:var(--text-2)}
.quiet-btn.danger{color:#b4413c}
.quiet-btn.danger:hover{background:rgba(180,65,60,.08);color:#b4413c}
.quiet-btn.danger[aria-disabled="true"]:hover{background:var(--surface-2)}
[data-theme="dark"] .quiet-btn.danger{color:#e0796f}
[data-theme="dark"] .quiet-btn.danger:hover{background:rgba(224,121,111,.1);color:#e0796f}

/* the one filled red in the app: the confirm step of a destructive action */
.btn-danger{
  height:36px;padding:0 18px;border-radius:var(--r-control);background:#b4413c;color:#fff;
  font-size:13.5px;font-weight:600;
  transition:background-color .16s var(--ease), transform .12s var(--ease);
}
.btn-danger:hover{background:#a1382f}
.btn-danger:active{transform:scale(.98)}
[data-theme="dark"] .btn-danger:hover{background:#c9553f}

.cf-modal{width:min(440px,92vw)}
.cf-warn{
  display:flex;gap:12px;padding:14px 15px;
  border:1px solid rgba(180,65,60,.22);border-radius:var(--r-control);
  background:rgba(180,65,60,.06);
}
.cf-warn > i.ph{font-size:18px;flex:none;margin-top:1px;color:#b4413c}
.cf-warn p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.6}
.cf-warn p + p{margin-top:10px;color:var(--text-3)}
.cf-warn ul{display:flex;flex-direction:column;gap:5px;margin:9px 0 0;padding:0;list-style:none}
.cf-warn li{position:relative;padding-left:13px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.cf-warn li::before{
  content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;
  border-radius:50%;background:var(--text-3);
}
[data-theme="dark"] .cf-warn{background:rgba(224,121,111,.08);border-color:rgba(224,121,111,.24)}
[data-theme="dark"] .cf-warn > i.ph{color:#e0796f}

/* --------------------------------------------------------------- 个性化
   Identity is edited here and shows up in the rail at once, so the avatar
   treatments live on .avatar itself rather than on a private copy. */
.avatar.lg{width:52px;height:52px;font-size:18px;font-weight:680}
.avatar[data-av="accent"]{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.avatar[data-av="ink"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.pf-avs{display:flex;align-items:center;gap:8px}
.av-sw{
  position:relative;width:26px;height:26px;flex:none;border-radius:50%;
  border:1px solid var(--border);
  transition:box-shadow .18s var(--ease), transform .12s var(--ease);
}
.av-sw:hover{transform:scale(1.07)}
.av-sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raised), 0 0 0 4px var(--accent)}
.av-sw[data-av="default"]{background:var(--surface-2)}
.av-sw[data-av="accent"]{background:var(--accent)}
.av-sw[data-av="ink"]{background:var(--text)}

.pf-name{width:220px;height:36px}
.pf-ctx{height:auto;min-height:128px;padding:11px 12px;line-height:1.7;resize:vertical}
.pf-ctx::placeholder{color:var(--text-3)}
.pf-ctx-foot{display:flex;align-items:center;gap:12px;min-width:0}
.pf-count{font-family:var(--font-data);font-size:11.5px;color:var(--text-3);flex:none}
.pf-count.full{color:#b4413c}
[data-theme="dark"] .pf-count.full{color:#e0796f}
.pf-state{font-size:12px;color:var(--text-3);flex:1;min-width:0}
.pf-state.dirty{color:var(--accent)}
.pf-save{height:34px;padding:0 16px;font-size:13px;margin-left:auto;flex:none}
.pf-save[aria-disabled="true"]{background:var(--surface-2);color:var(--text-3);cursor:default}
.pf-save[aria-disabled="true"]:hover{background:var(--surface-2)}
.pf-save[aria-disabled="true"]:active{transform:none}

.pf-seg{grid-template-columns:repeat(3,1fr);width:216px;margin:0;padding:3px}
.pf-seg .seg-i{height:28px}

/* the size readout needs something to size, so the sample line carries it */
.gn-preview{padding:14px 20px 18px;border-top:1px solid var(--border);background:var(--panel)}
.gn-preview + .gn-row{border-top:1px solid var(--border)}
.gp-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.gp-head .lb{font-size:12.5px;font-weight:550;color:var(--text-2)}
.gp-size{font-family:var(--font-data);font-size:11.5px;color:var(--text-3)}
.gp-msg{display:flex;align-items:flex-start;gap:11px}
.gp-msg p{
  margin:0;min-width:0;color:var(--text);line-height:1.75;
  font-size:var(--gp-fs,15px);transition:font-size .18s var(--ease);
}

.pf-accs{display:flex;align-items:center;gap:9px}
.acc-sw{
  position:relative;width:24px;height:24px;flex:none;border-radius:50%;
  border:1px solid rgba(0,0,0,.12);
  transition:box-shadow .18s var(--ease), transform .12s var(--ease);
}
.acc-sw:hover{transform:scale(1.07)}
.acc-sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raised), 0 0 0 4px var(--text-3)}

@media (max-width:1040px){
  .set{padding:28px 22px 40px}
  .gn{padding:28px 22px 40px}
}
@media (max-width:900px){
  .set-card{grid-template-columns:1fr}
  .set-side{border-right:0;border-bottom:1px solid var(--border);border-radius:calc(var(--r-card) - 1px) calc(var(--r-card) - 1px) 0 0}
  .set-pane{padding:20px 18px 24px}
  .set-head h1{font-size:26px}
  .gn{padding:24px 16px 36px}
  .gn-cap{padding:16px 16px 6px}
  .gn-row{gap:18px;padding:14px 16px}
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ============================================================ TOP CONTROL BAR -->
  <header class="topbar">
    <div class="tb-group">
      <button class="icon-btn" id="sbToggle" aria-label="收起侧栏" title="收起侧栏">
        <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 19.5 12 4.5l6.5 15"/><path d="M8.6 13.4h6.8"/>
          </svg>
        </span>
        <span class="brand-name">Avery</span>
      </div>
      <span class="tb-div" aria-hidden="true"></span>
      <div class="crumb">
        <span>设置</span>
        <i class="ph ph-caret-right" aria-hidden="true"></i>
        <b id="crumbLeaf">常规</b>
      </div>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group win-ctl">
      <button class="win-btn" id="winMin" type="button" aria-label="最小化" title="最小化">
        <i class="ph ph-minus" aria-hidden="true"></i>
      </button>
      <button class="win-btn" id="winMax" type="button" aria-label="全屏" title="全屏">
        <i class="ph ph-corners-out" aria-hidden="true"></i>
      </button>
      <button class="win-btn close" id="winClose" type="button" aria-label="关闭" title="关闭">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="body">

    <!-- ================================================================ SIDEBAR
         Settings has its own rail: the primary button goes back to the
         workspace, and the list below it is the settings sections. -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-inner">
        <a class="new-chat" id="backWorkspace" href="index.html">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
          <span>返回工作区</span>
        </a>

        <div class="sb-scroll">
          <nav class="nav" id="navList" aria-label="设置">
            <div class="nav-ind" id="navInd" aria-hidden="true"></div>
            <button class="nav-item active" data-set="general" aria-current="true">
              <i class="ph ph-gear-six" aria-hidden="true"></i><span>常规</span>
            </button>
            <button class="nav-item" data-set="persona">
              <i class="ph ph-user-circle" aria-hidden="true"></i><span>个性化</span>
            </button>
            <button class="nav-item" data-set="model">
              <i class="ph ph-sliders-horizontal" aria-hidden="true"></i><span>模型配置</span>
            </button>
            <button class="nav-item" data-set="browser">
              <i class="ph ph-globe" aria-hidden="true"></i><span>浏览器控制</span>
            </button>
          </nav>
        </div>

        <div class="sb-foot">
          <div class="uc-row">
            <button class="user-card menu-trigger" id="userCard" type="button"
                    aria-expanded="false" aria-haspopup="true" aria-controls="userMenu" title="账户">
              <span class="avatar" id="userAv" data-av="default" aria-hidden="true">陈</span>
              <span class="uc-body">
                <span class="uc-name" id="userName">陈奕然</span>
              </span>
              <i class="ph ph-caret-up chev" aria-hidden="true"></i>
            </button>
          </div>
          <div class="sb-note">原型版本。设置项与数字均为示例数据。</div>
        </div>
      </div>
    </aside>

    <!-- =================================================================== MAIN -->
    <main class="main" id="main">
      <div class="thread" id="thread"></div>
    </main>

  </div>
</div>

<!-- account menu: lives outside the app shell so the sidebar clip cannot cut it -->
<div class="menu user-menu" id="userMenu" role="menu" aria-label="账户">
  <div class="um-balance">
    <span class="l">余额</span>
    <span class="v">¥ 128.50</span>
  </div>
  <div class="menu-sep" aria-hidden="true"></div>
  <button class="menu-item um-row" type="button" id="umTheme" role="menuitemcheckbox" aria-checked="false">
    <i class="ph ph-moon" id="umThemeIcon" aria-hidden="true"></i>
    <span class="mt">深色模式</span>
    <span class="switch" aria-hidden="true"><span class="knob"></span></span>

  <button class="menu-item plain" type="button" id="umHelp">
    <i class="ph ph-question" aria-hidden="true"></i><span class="mt">帮助</span>
  </button>
  <div class="menu-sep" aria-hidden="true"></div>
  <button class="menu-item plain um-danger" type="button" id="umLogout">
    <i class="ph ph-sign-out" aria-hidden="true"></i><span class="mt">退出登录</span>
  </button>
</div>

<div class="toast" id="toast" role="status"><i class="ph ph-check-circle" aria-hidden="true"></i><span id="toastMsg">已保存</span></div>

<!-- model config dialog: 模型 ID / window / output / input and output types -->
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mdTitle" aria-hidden="true">
  <div class="md-head">
    <span class="md-title" id="mdTitle">编辑模型配置</span>
    <button class="icon-btn md-x" id="mdClose" type="button" aria-label="关闭" title="关闭">

  <div class="md-body" id="mdBody"></div>
  <div class="md-foot">
    <button class="ghost-btn" id="mdCancel" type="button">取消</button>
    <button class="btn-accent" id="mdSave" type="button">保存</button>
  </div>
</div>

<!-- clearing the built-in browser's data cannot be undone, so it asks first -->
<div class="scrim" id="cfScrim"></div>
<div class="modal cf-modal" id="cfModal" role="dialog" aria-modal="true" aria-labelledby="cfTitle" aria-hidden="true">
  <div class="md-head">
    <span class="md-title" id="cfTitle">清除内置浏览器的全部数据</span>
    <button class="icon-btn md-x" id="cfClose" type="button" aria-label="关闭" title="关闭">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  </div>
  <div class="md-body" id="cfBody"></div>
  <div class="md-foot">
    <button class="ghost-btn" id="cfCancel" type="button">取消</button>
    <button class="btn-danger" id="cfOk" type="button">清除全部数据</button>
  </div>
</div>

<script>
/* ============================================================================
   Avery - settings prototype (model providers).
   Sample data only: nothing here talks to a real API.
   ========================================================================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Chinese lead + Latin value needs a space between them, 简体中文 does not */
const zhJoin = (lead, val) => lead + (/^[A-Za-z0-9]/.test(val) ? ' ' : '') + String(val);

const state = { collapsed:false, theme:'light' };

const API_FORMATS = [
  { key:'chat', label:'Chat Completions (/chat/completions)', note:'OpenAI 兼容的对话补全接口，大多数供应商都用它。' },
  { key:'responses', label:'Responses (/responses)', note:'OpenAI 较新的接口，支持内置工具与推理摘要。' },
  { key:'messages', label:'Anthropic Messages (/v1/messages)', note:'Claude 系列的原生接口。' }
];
const API_LABEL = k => (API_FORMATS.find(f => f.key === k) || API_FORMATS[0]).label;

const GROUPS = ['推荐', '自定义供应商'];

let PROVIDERS = [
  {
    id:'deepseek', name:'DeepSeek', group:'推荐', logo:true, on:true, def:null,
    base:'https://api.deepseek.com/v1', api:'chat',
    key:'sk-ds-9c41f7b2e08a5d36c1b9e74a2d05f8c36e1a4b97',
    /* what the provider would report back from 获取模型列表 */
    fetchable:['deepseek-chat', 'deepseek-reasoner', 'deepseek-coder'],
    models:[
      { id:'deepseek-chat',     ctxWin:128000, maxOut:8192,  in:{ image:false, pdf:false }, out:{ text:true } },
      { id:'deepseek-reasoner', ctxWin:128000, maxOut:65536, in:{ image:false, pdf:false }, out:{ text:true } }
    ]
  },
  {
    id:'glmapi', name:'glm-api', group:'自定义供应商', icon:'ph-cube', on:true, def:null,
    base:'https://open.bigmodel.cn/api/paas/v4', api:'chat',
    key:'sk-glm-2b8e4c07f9a15d3e6c480b71a2f5d93e0c74b186',
    fetchable:['glm-5.3-flash', 'glm-5.3-air', 'glm-4.6', 'glm-4.6-air'],
    models:[
      { id:'glm-5.3-flash', ctxWin:1000000, maxOut:128000, in:{ image:true, pdf:true }, out:{ text:true } }
    ]
  }
];

/* renaming / keyShown are transient view state, not saved data */
const sstate = { section:'general', sel:'glmapi', renaming:false, keyShown:false };
/* the rail label and the breadcrumb leaf are the same word */
const SECTION_LABEL = { general:'常规', persona:'个性化', model:'模型配置', browser:'浏览器控制' };
/* the model dialog works on a draft, so 取消 really cancels */
let mstate = null;

function prov(){ return PROVIDERS.find(p => p.id === sstate.sel) || null; }

/* context window reads as a chip: 1000000 -> 1M, 128000 -> 128K */
function fmtCtx(n){
  n = Number(n) || 0;
  if(n >= 1000000){ return (n / 1000000).toFixed(n % 1000000 ? 1 : 0) + 'M'; }
  if(n >= 1000){ return Math.round(n / 1000) + 'K'; }
  return String(n);
}

function chkHTML(key, label, on, locked){
  return `
    <label class="chk${locked ? ' locked' : ''}">
      <input type="checkbox" id="md-${key}"${on ? ' checked' : ''}${locked ? ' disabled' : ''}>
      <i class="ph ph-check box" aria-hidden="true"></i>
      <span>${esc(label)}</span>
      ${locked ? '<i class="ph ph-lock-simple lock" aria-hidden="true"></i>' : ''}
    </label>`;
}

function focusSelect(sel){
  const el = $(sel);
  if(!el){ return; }
  el.focus();
  if(el.select){ el.select(); return; }
  const n = el.value.length;
  try{ el.setSelectionRange(n, n); }catch(_){}
}

/* ------------------------------------------------------------------ left list */
function renderSetSide(){
  const host = $('#setSide');
  if(!host){ return; }
  const groups = GROUPS.filter(g => PROVIDERS.some(p => p.group === g));
  PROVIDERS.forEach(p => { if(!groups.includes(p.group)){ groups.push(p.group); } });
  const groupHTML = groups.map(g => `
    <div class="set-group">${esc(g)}</div>
    ${PROVIDERS.filter(p => p.group === g).map(p => `
      <button class="prov${p.id === sstate.sel ? ' sel' : ''}" type="button" data-prov="${esc(p.id)}"${p.id === sstate.sel ? ' aria-current="true"' : ''}>
        ${p.logo ? '<span class="prov-logo" aria-hidden="true"></span>' : `<i class="ph ${esc(p.icon)}" aria-hidden="true"></i>`}
        <span class="pn">${esc(p.name)}</span>
        <span class="dot${p.on ? ' on' : ''}" title="${p.on ? '已启用' : '未启用'}"></span>
      </button>`).join('')}
  `).join('');
  host.innerHTML = groupHTML + (PROVIDERS.length ? '' : '<div class="set-group">供应商</div>') + `
    <button class="prov-add" id="addProv" type="button">
      <i class="ph ph-plus" aria-hidden="true"></i><span>添加供应商</span>
    </button>`;
  $$('.prov', host).forEach(b => b.addEventListener('click', () => selectProv(b.dataset.prov)));
  $('#addProv', host).addEventListener('click', addProv);
}

/* ---------------------------------------------------------------- right pane */
function mrowHTML(m, i, p){
  const isDef = p.def === m.id;
  return `
    <div class="mrow" data-mi="${i}">
      <span class="mrow-name">${esc(m.id)}</span>
      <span class="mrow-chips">
        ${m.in && m.in.image ? '<span class="jtag">视觉</span>' : ''}
        <span class="jtag">${esc(fmtCtx(m.ctxWin))}</span>
      </span>
      <span class="mrow-acts">
        <button class="icon-btn sm${isDef ? ' def' : ''}" type="button" data-m-act="def" data-mi="${i}"
                aria-label="设为默认模型" title="设为默认模型"><i class="ph${isDef ? ' ph-fill' : ''} ph-lightning" aria-hidden="true"></i></button>
        <button class="icon-btn sm" type="button" data-m-act="edit" data-mi="${i}"
                aria-label="编辑模型配置" title="编辑模型配置"><i class="ph ph-pencil-simple" aria-hidden="true"></i></button>
        <button class="icon-btn sm" type="button" data-m-act="del" data-mi="${i}"
                aria-label="删除模型" title="删除模型"><i class="ph ph-trash" aria-hidden="true"></i></button>
      </span>
    </div>`;
}

function paneInner(){
  const p = prov();
  if(!p){
    return '<div class="set-empty">左边还没有供应商。先添加一个，填好 Base URL 和 API Key 之后就能在聊天里选择使用。</div>';
  }
  const list = p.models.length
    ? p.models.map((m, i) => mrowHTML(m, i, p)).join('')
    : '<div class="mrow-empty">还没有添加模型。填好供应商信息后，在这里加上可用的模型名。</div>';
  return `
    <div class="set-d-head">
      ${sstate.renaming
        ? `<input class="set-name-inp" id="setName" value="${esc(p.name)}" aria-label="供应商名称" spellcheck="false">`
        : `<span class="set-name">${esc(p.name)}</span>
           <button class="icon-btn sm" id="setRename" type="button" aria-label="重命名供应商" title="重命名供应商">
             <i class="ph ph-pencil-simple" aria-hidden="true"></i>
           </button>`}
      <span class="pill ${p.on ? 'on' : 'off'}">${p.on ? '已启用' : '未启用'}</span>
      <button class="pill-btn" id="setToggle" type="button">${p.on ? '禁用' : '启用'}</button>

function renderSetMain(anim){
  const host = $('#setMain');
  if(!host){ return; }
  const pane = document.createElement('div');
  pane.className = 'set-pane';
  pane.innerHTML = paneInner();
  host.replaceChildren(pane);
  wirePane(pane);
  /* a fresh node each time, so the entry animation replays on a swap */
  if(anim && !reduceMotion){ pane.classList.add('view-anim'); }
}

function wirePane(pane){
  const p = prov();

  const rename = $('#setRename', pane);
  if(rename){ rename.addEventListener('click', () => { sstate.renaming = true; renderSetMain(false); focusSelect('#setName'); }); }

  const nameInp = $('#setName', pane);
  if(nameInp){
    let done = false;
    const commit = () => {
      if(done){ return; }
      done = true;
      const v = nameInp.value.trim();
      if(v && p){ p.name = v; }
      sstate.renaming = false;
      renderSetSide();
      renderSetMain(false);
      if(v){ toast('供应商名称已更新'); }
    };
    const cancel = () => { if(done){ return; } done = true; sstate.renaming = false; renderSetMain(false); };
    nameInp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); cancel(); }
    });
    nameInp.addEventListener('blur', commit);
  }

  const baseInp = $('#setBase', pane);
  if(baseInp){ baseInp.addEventListener('input', () => { if(p){ p.base = baseInp.value; } }); }

  const keyInp = $('#setKey', pane);
  if(keyInp){ keyInp.addEventListener('input', () => { if(p){ p.key = keyInp.value; } }); }

  const eye = $('#setEye', pane);
  if(eye){ eye.addEventListener('click', () => { sstate.keyShown = !sstate.keyShown; renderSetMain(false); focusSelect('#setKey'); }); }

  const toggle = $('#setToggle', pane);
  if(toggle){ toggle.addEventListener('click', () => {
    if(!p){ return; }
    p.on = !p.on;
    renderSetSide();
    renderSetMain(false);
    toast(p.on ? p.name + ' 已启用，可在聊天里选择使用' : p.name + ' 已禁用');
  }); }

  const delProv = $('#setDelete', pane);
  if(delProv){ delProv.addEventListener('click', () => {
    if(!p){ return; }
    const i = PROVIDERS.indexOf(p);
    PROVIDERS.splice(i, 1);
    const next = PROVIDERS[Math.min(i, PROVIDERS.length - 1)];
    sstate.sel = next ? next.id : null;
    sstate.renaming = false;
    sstate.keyShown = false;
    renderSetSide();
    renderSetMain(true);
    toast('已删除 ' + p.name);
  }); }

  $$('[data-api]', pane).forEach(b => b.addEventListener('click', () => {
    if(!p){ return; }
    closeMenus();
    p.api = b.dataset.api;
    renderSetMain(false);
    toast('API 格式改为 ' + API_LABEL(p.api));
  }));

  $$('[data-m-act]', pane).forEach(b => b.addEventListener('click', () => {
    if(!p){ return; }
    const i = Number(b.dataset.mi);
    const m = p.models[i];
    if(!m){ return; }
    const act = b.dataset.mAct;

    if(act === 'def'){
      p.def = p.def === m.id ? null : m.id;
      renderSetMain(false);
      toast(p.def ? m.id + ' 已设为默认模型' : m.id + ' 不再是默认模型');
      return;
    }
    if(act === 'edit'){
      openModelModal(i);
      return;
    }
    if(act === 'del'){
      const row = b.closest('.mrow');
      if(row && !reduceMotion){ row.classList.add('leaving'); }
      setTimeout(() => {
        if(p.def === m.id){ p.def = null; }
        p.models.splice(i, 1);
        renderSetMain(false);
        toast('已删除模型 ' + m.id);
      }, reduceMotion ? 0 : 200);
    }
  }));

  const addModel = $('#setAddModel', pane);
  if(addModel){ addModel.addEventListener('click', () => openModelModal(-1)); }

  const getModels = $('#setGet', pane);
  if(getModels){ getModels.addEventListener('click', () => {
    if(!p){ return; }
    getModels.classList.remove('spin');
    void getModels.offsetWidth;
    getModels.classList.add('spin');
    setTimeout(() => getModels.classList.remove('spin'), 640);

    const pool = p.fetchable || [];
    if(!pool.length){ toast('先填好 Base URL 与 API Key，再获取模型列表'); return; }
    const have = new Set(p.models.map(m => m.id));
    const fresh = pool.filter(id => !have.has(id));
    if(!fresh.length){ toast('已是最新，没有新增模型'); return; }
    const from = p.models.length;
    fresh.forEach(id => p.models.push({
      id, ctxWin:128000, maxOut:8192, in:{ image:false, pdf:false }, out:{ text:true }
    }));
    renderSetMain(false);
    fresh.forEach((id, k) => {
      const row = $('.mrow[data-mi="' + (from + k) + '"]', $('#setMain'));
      if(row && !reduceMotion){ row.classList.add('enter'); }
    });
    toast('已获取 ' + pool.length + ' 个模型，新增 ' + fresh.length + ' 个');
  }); }
}

/* ------------------------------------------------------- model config dialog */
/* i >= 0 edits an existing model, i === -1 adds one. Everything works on a
   draft, so 取消 leaves the model list untouched. */
function openModelModal(i){
  const p = prov();
  if(!p){ return; }
  const m = i >= 0 ? p.models[i] : null;
  if(i >= 0 && !m){ return; }
  mstate = {
    i,
    draft: m
      ? { id:m.id, ctxWin:m.ctxWin, maxOut:m.maxOut, in:{ image:!!m.in.image, pdf:!!m.in.pdf } }
      : { id:'', ctxWin:128000, maxOut:8192, in:{ image:false, pdf:false } }
  };
  $('#mdTitle').textContent = m ? '编辑模型配置' : '添加模型';
  renderModal();
  $('#scrim').classList.add('show');
  const modal = $('#modal');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  const first = $('#mdId');
  if(first){ first.focus(); first.select(); }
}

function hideModal(){
  const modal = $('#modal');
  if(!modal.classList.contains('show')){ return false; }
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('show');
  return true;
}

/* whatever opened the dialog takes focus back: the row button, or 添加模型 */
function focusOpener(i){
  const sel = i >= 0 ? '.mrow[data-mi="' + i + '"] [data-m-act="edit"]' : '#setAddModel';
  const b = $(sel, $('#setMain'));
  if(b){ b.focus(); }
}

/* 取消 / × / scrim: drop the draft, put focus back where it came from */
function closeModelModal(){
  const i = mstate ? mstate.i : -1;
  if(!hideModal()){ return; }
  mstate = null;
  focusOpener(i);
}

function renderModal(){
  const d = mstate.draft;
  $('#mdBody').innerHTML = `
    <label class="set-field">
      <span class="lb">模型 ID</span>
      <input class="set-inp" id="mdId" value="${esc(d.id)}" placeholder="供应商文档里的模型名" spellcheck="false" autocomplete="off">
    </label>
    <label class="set-field">
      <span class="lb">上下文窗口</span>
      <input class="set-inp" id="mdCtx" value="${esc(String(d.ctxWin))}" inputmode="numeric" spellcheck="false">
    </label>
    <label class="set-field">
      <span class="lb">最大输出 Token</span>
      <input class="set-inp" id="mdOut" value="${esc(String(d.maxOut))}" inputmode="numeric" spellcheck="false">
    </label>
    <div class="set-field">
      <span class="lb">输入类型</span>
      <div class="chk-row">
        ${chkHTML('in-text', '文本', true, true)}
        ${chkHTML('in-image', '图片', d.in.image, false)}
        ${chkHTML('in-pdf', 'PDF', d.in.pdf, false)}
      </div>
    </div>
    <div class="set-field">
      <span class="lb">输出类型</span>
      <div class="chk-row">${chkHTML('out-text', '文本', true, true)}</div>
    </div>`;

  ['#mdCtx', '#mdOut'].forEach(sel => {
    const el = $(sel);
    if(!el){ return; }
    el.addEventListener('input', () => {
      const v = el.value.replace(/[^0-9]/g, '');
      if(v !== el.value){ el.value = v; }
      el.classList.remove('bad');
    });
  });
  const idInp = $('#mdId');
  if(idInp){ idInp.addEventListener('input', () => idInp.classList.remove('bad')); }
  $$('#mdBody input', $('#modal')).forEach(inp => inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); saveModelModal(); }
  }));
}

function saveModelModal(){
  const p = prov();
  if(!p || !mstate){ return; }
  const id = $('#mdId').value.trim();
  const ctx = parseInt($('#mdCtx').value, 10);
  const out = parseInt($('#mdOut').value, 10);
  const dup = p.models.some((x, k) => k !== mstate.i && x.id === id);
  $('#mdId').classList.toggle('bad', !id || dup);
  $('#mdCtx').classList.toggle('bad', !(ctx > 0));
  $('#mdOut').classList.toggle('bad', !(out > 0));
  if(!id){ toast('模型 ID 不能为空'); $('#mdId').focus(); return; }
  if(dup){ toast('已经有同名的模型 ID'); $('#mdId').focus(); return; }
  if(!(ctx > 0)){ toast('上下文窗口要填正整数'); $('#mdCtx').focus(); return; }
  if(!(out > 0)){ toast('最大输出 Token 要填正整数'); $('#mdOut').focus(); return; }

  const next = {
    id, ctxWin:ctx, maxOut:out,
    in:{ image:$('#md-in-image').checked, pdf:$('#md-in-pdf').checked },
    out:{ text:true }
  };
  const i = mstate.i;
  if(i >= 0){
    const wasDef = p.def === p.models[i].id;
    p.models[i] = next;
    if(wasDef){ p.def = id; }
  } else {
    p.models.push(next);
  }
  hideModal();
  mstate = null;
  renderSetMain(false);
  if(i < 0){
    const row = $('.mrow[data-mi="' + (p.models.length - 1) + '"]', $('#setMain'));
    if(row && !reduceMotion){ row.classList.add('enter'); }
  }
  focusOpener(i);
  toast(i >= 0 ? '模型配置已保存' : '已添加模型 ' + id);
}

  /* the page is cheap to rebuild, and a rebuild is the cleanest way to put every

  const reset = $('#gnReset', $('#thread'));

/* flip one switch in place: no rebuild, so focus and the page stay put */
function syncGeneral(key){

    if(gstate[key]){ b.removeAttribute('aria-disabled'); } else { b.setAttribute('aria-disabled', 'true'); }
  });
}

/* ============================================================================
   浏览器控制 page: which browser Avery may drive, whether it can reach it, and
   the data the built-in browser leaves behind. Nothing here talks to a real
   browser: 检测状态 reports what the prototype says it would find.
   ========================================================================== */
const BROWSERS = [
  {
    key:'builtin', label:'内置浏览器', ready:true,
    need:'内置浏览器随应用一起启动，重新打开设置页就能再连一次。',
    ok:'它随应用一起启动，Avery 可以直接接管标签页，数据也只放在应用自己的目录里。'
  },
  {
    key:'chrome', label:'Google Chrome', ready:false,
    need:'在 Chrome 上先打开调试端口：chrome.exe --remote-debugging-port=9222，然后回到这里重新检测。',
    ok:'已经连上 Chrome 的调试端口 9222，可以接管标签页。'
  },
  {
    key:'edge', label:'Microsoft Edge', ready:true,
    need:'在 Edge 上先打开调试端口：msedge.exe --remote-debugging-port=9222，然后回到这里重新检测。',
    ok:'已经连上 Edge 的调试端口 9222，可以接管标签页。'
  }
];
const BROWSER_LABEL = k => (BROWSERS.find(b => b.key === k) || BROWSERS[0]).label;
const browser = () => BROWSERS.find(b => b.key === bstate.pick) || BROWSERS[0];

const bstate = { pick:'builtin', busy:false, closeTabs:true, cacheMB:312, siteMB:214 };
/* only a completed 检测 writes here, so 未检测 stays honest */
const bdetected = {};
let bwTimer = null;

function fmtData(mb){
  if(!(mb > 0)){ return '0 MB'; }
  return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
}

function statusDesc(b){
  if(bstate.busy){ return '正在检测 ' + b.label + '，检测期间不会打开或改动任何页面。'; }
  const done = bdetected[b.key];
  if(done === undefined){ return '还没有检测过。' + b.need; }
  return done ? '已连接。' + b.ok : '没有连上。' + b.need;
}

function cacheDesc(){
  return bstate.cacheMB
    ? '页面和资源缓存 ' + fmtData(bstate.cacheMB) + '。清掉之后第一次打开网站会慢一点，登录状态不受影响。'
    : '缓存已经清空了。下次打开网站会重新下载资源。';
}

function allDesc(){
  const total = bstate.cacheMB + bstate.siteMB;
  return total
    ? '缓存、Cookie、登录状态和站点数据共 ' + fmtData(total) + '。清掉之后要重新登录各个网站，这个操作不能撤销。'
    : '内置浏览器里已经没有数据了。';
}

function statusPill(b){
  if(bstate.busy){
    return '<span class="pill off busy"><i class="ph ph-circle-notch" aria-hidden="true"></i>检测中</span>';
  }
  const done = bdetected[b.key];
  if(done === undefined){ return '<span class="pill off">未检测</span>'; }
  return done ? '<span class="pill on">已连接</span>' : '<span class="pill off">未连接</span>';
}

function renderBrowser(){

  const b = browser();

  const other = bstate.pick === 'builtin' ? '' : `

      <i class="ph ph-info" aria-hidden="true"></i>
      <span>当前选用的是 ${esc(b.label)}。下面两项仍然只清理内置浏览器的数据，和它没有关系。</span>

        </div>

            <button class="quiet-btn" id="bwCheck" type="button"${bstate.busy ? ' aria-disabled="true"' : ''}>

            </button>

function wireBrowser(){
  const card = $('#bwCard');
  if(!card){ return; }

  const menu = $('#gn-browser-menu', card);
  if(menu){ $$('.menu-item', menu).forEach(it => it.addEventListener('click', () => pickBrowser(it.dataset.opt))); }

  const check = $('#bwCheck', card);
  if(check){ check.addEventListener('click', detectBrowser); }

  const cleanCache = $('#bwCleanCache', card);
  if(cleanCache){ cleanCache.addEventListener('click', () => {
    if(!bstate.cacheMB){ toast('缓存已经是空的'); return; }
    const freed = bstate.cacheMB;
    bstate.cacheMB = 0;
    renderBrowser();
    const b = $('#bwCleanCache');
    if(b){ b.focus(); }
    toast('已清除内置浏览器缓存，释放 ' + fmtData(freed));
  }); }

  const cleanAll = $('#bwCleanAll', card);
  if(cleanAll){ cleanAll.addEventListener('click', openClearAll); }

  const sw = $('.switch[data-key="closeTabs"]', card);
  if(sw){ sw.addEventListener('click', () => {
    bstate.closeTabs = !bstate.closeTabs;
    sw.classList.toggle('on', bstate.closeTabs);
    sw.setAttribute('aria-checked', String(bstate.closeTabs));
    toast(bstate.closeTabs ? '任务结束后会自动关闭标签页' : '任务结束后保留标签页');
  }); }
}

function pickBrowser(key){
  closeMenus();
  if(bstate.pick === key){ return; }
  clearTimeout(bwTimer);
  bstate.pick = key;
  bstate.busy = false;
  renderBrowser();
  const sel = $('#gn-browser');
  if(sel){ sel.focus(); }
  toast(zhJoin('浏览器已切换为', BROWSER_LABEL(key)));
}

/* 检测中 is a real intermediate state: the answer arrives after the round trip */
function detectBrowser(){
  if(bstate.busy){ return; }
  const b = browser();
  const key = b.key;
  bstate.busy = true;
  renderBrowser();
  const btn = $('#bwCheck');
  if(btn){ btn.focus(); }
  clearTimeout(bwTimer);
  bwTimer = setTimeout(() => {
    if(bstate.pick !== key || !bstate.busy){ return; }
    bstate.busy = false;
    bdetected[key] = b.ready;
    renderBrowser();
    const again = $('#bwCheck');
    if(again){ again.focus(); }
    toast(b.ready ? zhJoin('已连接', b.label) : zhJoin('没有连上', b.label));
  }, reduceMotion ? 220 : 900);
}

function confirmWarnHTML(){

        <ul>

      </div>
    </div>`;
}

function openClearAll(){
  if(!(bstate.cacheMB + bstate.siteMB)){ toast('内置浏览器里已经没有数据了'); return; }
  $('#cfBody').innerHTML = confirmWarnHTML();
  $('#cfScrim').classList.add('show');
  const modal = $('#cfModal');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  /* the safe choice takes focus, not the red one */
  const cancel = $('#cfCancel');
  if(cancel){ cancel.focus(); }
}

function hideConfirm(){
  const modal = $('#cfModal');
  if(!modal.classList.contains('show')){ return false; }
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  $('#cfScrim').classList.remove('show');
  return true;
}

function focusClearAll(){
  const b = $('#bwCleanAll');
  if(b){ b.focus(); }
}

function cancelClearAll(){
  if(!hideConfirm()){ return; }
  focusClearAll();
}

function doClearAll(){
  const freed = bstate.cacheMB + bstate.siteMB;
  bstate.cacheMB = 0;
  bstate.siteMB = 0;
  hideConfirm();
  renderBrowser();
  focusClearAll();
  toast('已清除内置浏览器的全部数据，释放 ' + fmtData(freed));
}

/* 陈 stays 陈, chen becomes C: the letter avatar never breaks */
function initialOf(name){
  const t = String(name || '').trim();
  if(!t){ return 'A'; }
  const c = t.charAt(0);
  return /[a-z]/i.test(c) ? c.toUpperCase() : c;
}

function sizePx(key){ return (SIZES.find(s => s.key === key) || SIZES[1]).px; }

/* the rail card and the preview avatar are always the same person */
function applyIdentity(){
  const ch = initialOf(pstate.name);
  const side = $('#userAv'), sideName = $('#userName'), preview = $('#pfAv');

  if(sideName){ sideName.textContent = pstate.name; }

}

function wirePersona(){
  const card = $('#pfCard');
  if(!card){ return; }

  $$('.av-sw', card).forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.av;
    if(key === pstate.av){ return; }
    pstate.av = key;
    $$('.av-sw', card).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.av === key)));
    applyIdentity();
    toast('头像底色已更新');
  }));

  const upload = $('#pfUpload', card);
  if(upload){ upload.addEventListener('click', () => toast('原型里没有接系统图片选择器')); }

  const nameInp = $('#pfName', card);
  if(nameInp){
    const commit = () => {
      const v = nameInp.value.trim();
      if(!v){ nameInp.value = pstate.name; toast('昵称不能为空'); return; }
      if(v === pstate.name){ return; }
      pstate.name = v;
      applyIdentity();
      renderPersona();
      toast('昵称已更新');
    };
    nameInp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); commit(); } });
    nameInp.addEventListener('blur', commit);
  }

  const ctx = $('#pfCtx', card);
  if(ctx){
    ctx.addEventListener('input', () => {
      let v = ctx.value;
      if(v.length > CTX_MAX){ v = v.slice(0, CTX_MAX); ctx.value = v; }
      pstate.ctxDraft = v;
      syncCtx();
    });
    /* the box is for prose, so Enter is a newline and Ctrl+Enter is the shortcut */
    ctx.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); saveCtx(); }
    });
  }

  const save = $('#pfSave', card);
  if(save){ save.addEventListener('click', saveCtx); }

  $$('.seg-i', card).forEach(b => b.addEventListener('click', () => setSize(b.dataset.size)));

  /* the two placeholders record the choice and say they are not wired up */
  $$('.acc-sw', card).forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.acc;
    if(key === pstate.accent){ return; }
    pstate.accent = key;
    $$('.acc-sw', card).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.acc === key)));
    const a = ACCENTS.find(x => x.key === key);
    toast('主题颜色还没有接，先记下' + (a ? a.label : '你的选择'));
  }));

  const menu = $('#gn-resume-menu', card);
  if(menu){
    $$('.menu-item', menu).forEach(it => it.addEventListener('click', () => {
      closeMenus();
      const key = it.dataset.opt;
      if(key === pstate.resume){ return; }
      pstate.resume = key;
      const v = $('#gn-resume-v');
      const r = RESUMES.find(x => x.key === key);
      if(v){ v.textContent = r ? r.label : ''; }
      $$('.menu-item', menu).forEach(x => {
        const on = x.dataset.opt === key;
        x.classList.toggle('sel', on);
        x.setAttribute('aria-checked', String(on));
      });
      toast('简历模板还没有接，先记下' + (r ? r.label : ''));
    }));
  }
}

/* the counter, the saved/dirty word and the button all read the same pair */
function syncCtx(){
  const dirty = pstate.ctxDraft !== pstate.ctxSaved;
  const n = pstate.ctxDraft.length;
  const count = $('#pfCount');
  if(count){
    count.textContent = n + ' / ' + CTX_MAX;
    count.classList.toggle('full', n >= CTX_MAX);
  }
  const state = $('#pfState');
  if(state){
    state.textContent = dirty ? '有改动还没保存' : '已保存';
    state.classList.toggle('dirty', dirty);
  }
  const save = $('#pfSave');
  if(save){
    if(dirty){ save.removeAttribute('aria-disabled'); }
    else { save.setAttribute('aria-disabled', 'true'); }
  }
}

function saveCtx(){
  if(pstate.ctxDraft === pstate.ctxSaved){ toast('还没有新的改动'); return; }
  pstate.ctxSaved = pstate.ctxDraft;
  syncCtx();
  toast('自定义上下文已保存');
}

function setSize(key){
  if(pstate.size === key){ return; }
  pstate.size = key;
  $$('.seg-i', $('#pfCard')).forEach(b => {
    const on = b.dataset.size === key;
    b.classList.toggle('sel', on);
    b.setAttribute('aria-checked', String(on));
  });
  const px = sizePx(key);
  const preview = $('#pfPreview');
  if(preview){ preview.style.setProperty('--gp-fs', px + 'px'); }
  const out = $('#pfSizePx');
  if(out){ out.textContent = px + 'px'; }
}

/* --------------------------------------------------------------------- page */
/* the rail picks the section; the breadcrumb leaf follows it */
function selectSection(key){
  if(key === sstate.section || !SECTION_LABEL[key]){ return; }
  sstate.section = key;
  sstate.renaming = false;
  sstate.keyShown = false;
  closeMenus();
  $$('.nav-item', $('#navList')).forEach(b => {
    const on = b.dataset.set === key;
    b.classList.toggle('active', on);
    if(on){ b.setAttribute('aria-current', 'true'); } else { b.removeAttribute('aria-current'); }
  });
  moveIndicator();
  renderSet(true);
}

function syncCrumb(){
  const leaf = $('#crumbLeaf');
  if(leaf){ leaf.textContent = SECTION_LABEL[sstate.section] || ''; }
}

function renderSet(anim){
  if(sstate.section === 'general'){ renderGeneral(); }
  else if(sstate.section === 'persona'){ renderPersona(); }
  else if(sstate.section === 'browser'){ renderBrowser(); }
  else { renderModelSet(); }
  const root = $('.set-root', $('#thread'));
  if(anim && root && !reduceMotion){ root.classList.add('view-anim'); }
  syncCrumb();
  resetScroll();
}

/* a section swap starts at the top, and without the thread's smooth glide */
function resetScroll(){
  const host = $('#thread');
  if(!host){ return; }
  const prev = host.style.scrollBehavior;
  host.style.scrollBehavior = 'auto';
  host.scrollTop = 0;
  host.style.scrollBehavior = prev;
}

function renderModelSet(){
  $('#thread').innerHTML = `
    <div class="set set-root">
      <div class="set-head">
        <div>
          <h1>模型设置</h1>
          <p>管理自定义模型供应商，配置后可在聊天时选择使用。</p>
        </div>
        <button class="icon-btn set-refresh" id="setRefresh" type="button" aria-label="重新加载配置" title="重新加载配置">
          <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
        </button>
      </div>
      <div class="set-card">
        <aside class="set-side" id="setSide" aria-label="模型供应商"></aside>
        <div class="set-main" id="setMain"></div>
      </div>
    </div>`;

  const refresh = $('#setRefresh');
  refresh.addEventListener('click', () => {
    refresh.classList.remove('spin');
    void refresh.offsetWidth;
    refresh.classList.add('spin');
    setTimeout(() => refresh.classList.remove('spin'), 640);
    renderSetMain(true);
    toast('配置已重新加载');
  });

  renderSetSide();
  renderSetMain(false);
}

/* provider switching: same id, same pane, no need to replay the entry */
function selectProv(id){
  if(id === sstate.sel){ return; }
  sstate.sel = id;
  sstate.renaming = false;
  sstate.keyShown = false;
  renderSetSide();
  renderSetMain(true);
}

function addProv(){
  const id = 'p' + Date.now().toString(36);
  PROVIDERS.push({
    id, name:'新供应商', group:'自定义供应商', icon:'ph-cube', on:false, def:null,
    base:'', api:'chat', key:'', models:[]
  });
  sstate.sel = id;
  sstate.renaming = true;
  sstate.keyShown = false;
  renderSetSide();
  renderSetMain(true);
  focusSelect('#setName');
  toast('新供应商还没有启用');
}

/* ============================================================================
   Shell behaviour, same as the workspace: rail, theme, menus, toast.
   ========================================================================== */
function moveIndicator(){
  const nav = $('#navList'), ind = $('#navInd');
  const active = $('.nav-item.active', nav);
  if(!active){ ind.style.opacity = '0'; return; }
  ind.style.opacity = '1';
  ind.style.height = active.offsetHeight + 'px';
  ind.style.transform = 'translateY(' + active.offsetTop + 'px)';
}

function closeMenus(except){
  $$('.menu.open').forEach(m => { if(m !== except){ m.classList.remove('open'); } });
  $$('.menu-trigger').forEach(b => {
    if(document.getElementById(b.getAttribute('aria-controls')) !== except){
      b.setAttribute('aria-expanded', 'false');
    }
  });
}

/* Delegated, so menus rendered later still work. */
document.addEventListener('click', e => {
  const trigger = e.target.closest && e.target.closest('.menu-trigger');
  if(trigger){
    e.preventDefault();
    const menu = document.getElementById(trigger.getAttribute('aria-controls'));
    if(menu){
      const willOpen = !menu.classList.contains('open');
      closeMenus();
      if(willOpen){
        if(menu.classList.contains('user-menu')){ positionUserMenu(); }
        menu.classList.add('open');
        trigger.setAttribute('aria-expanded', 'true');
      }
    }
    return;
  }
  if(e.target.closest && e.target.closest('.menu')){ return; }
  closeMenus();
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape'){ return; }
  if($('#cfModal').classList.contains('show')){ cancelClearAll(); return; }
  if($('#modal').classList.contains('show')){ closeModelModal(); return; }
  closeMenus();
});

/* the model dialog: 取消 and the scrim discard the draft, 保存 writes it back */
$('#mdClose').addEventListener('click', () => closeModelModal());
$('#mdCancel').addEventListener('click', () => closeModelModal());
$('#mdSave').addEventListener('click', saveModelModal);
$('#scrim').addEventListener('click', () => closeModelModal());

/* the clear-data confirm: 取消 and the scrim back out, 清除全部数据 goes through */
$('#cfClose').addEventListener('click', cancelClearAll);
$('#cfCancel').addEventListener('click', cancelClearAll);
$('#cfScrim').addEventListener('click', cancelClearAll);
$('#cfOk').addEventListener('click', doClearAll);

$('#sbToggle').addEventListener('click', () => {
  state.collapsed = !state.collapsed;
  $('#app').classList.toggle('collapsed', state.collapsed);
  $('#sbToggle').setAttribute('aria-label', state.collapsed ? '展开侧栏' : '收起侧栏');
  setTimeout(moveIndicator, 400);
});

/* theme lives in the account menu */
function setTheme(t){
  state.theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = state.theme;
  const on = state.theme === 'dark';
  const row = $('#umTheme');
  if(row){
    row.classList.toggle('on', on);
    row.setAttribute('aria-checked', String(on));
    $('#umThemeIcon').className = 'ph ' + (on ? 'ph-sun' : 'ph-moon');
  }
}

/* pin the account menu above the user card, outside the sidebar clip */
function positionUserMenu(){
  const card = $('#userCard'), menu = $('#userMenu');
  if(!card || !menu){ return; }
  const r = card.getBoundingClientRect();
  menu.style.left = Math.round(r.left) + 'px';
  menu.style.bottom = Math.round(window.innerHeight - r.top + 8) + 'px';
}

$('#umTheme').addEventListener('click', () => setTheme(state.theme === 'dark' ? 'light' : 'dark'));
$('#umHelp').addEventListener('click', () => { closeMenus(); toast('原型里还没有接帮助文档'); });
$('#umLogout').addEventListener('click', () => { closeMenus(); toast('原型里还没有登录页，先不真的退出'); });

let toastTimer;
function toast(msg){
  $('#toastMsg').textContent = msg;
  const el = $('#toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

window.addEventListener('resize', () => {
  moveIndicator();
  if($('#userMenu').classList.contains('open')){ positionUserMenu(); }
});

/* ============================================================================
   Boot
   ========================================================================== */
$$('.nav-item', $('#navList')).forEach(b => b.addEventListener('click', () => selectSection(b.dataset.set)));
setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyIdentity();
renderSet();
requestAnimationFrame(moveIndicator);
setTimeout(moveIndicator, 300);
</script>
</body>
</html>
