<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avery - 设置（原型）</title>

<!-- Type: Manrope for anything that reads as data (numbers, labels, times),
     the system UI face for prose. Both fall back to system fonts, so the
     layout and rhythm survive if the font CDN is unavailable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap">

<!-- Icon library: Phosphor Icons (official package, loaded from CDN).
     Icons are decorative; every control keeps a text label or aria-label,
     so the layout stays intact if the CDN is unavailable. -->
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

<style>
/* ============================================================================
   AVERY - desktop prototype
   ---------------------------------------------------------------------------
   Palette lock ...... one accent (deep spruce) + pure neutral greys. No warm
                       cream, no orange, no blue/violet gradient anywhere.
   Shape lock ........ radius rule, applied everywhere:
                         cards / panels ....... 14px  (--r-card)
                         controls / inputs .... 10px  (--r-control)
                         chips / avatars ...... full (--r-pill)
   Theme lock ........ one theme for the whole app, toggled globally.
   Motion ............ entry, streaming and view switches only. Every
                       animation earns its place: feedback or state change.
   ============================================================================ */

:root{
  --r-card:14px; --r-control:10px; --r-pill:999px;

  --bg:#ffffff;
  --surface:#fafafa;          /* sidebar */
  --surface-2:#f4f4f5;        /* hover / user bubble */
  --panel:#ffffff;
  --raised:#ffffff;
  --border:#e8e8ea;
  --border-2:#d8d8dc;
  --text:#18181b;
  --text-2:#55555e;
  --text-3:#8b8b94;
  --accent:#17654f;
  --accent-hover:#12543f;
  --accent-soft:#eaf2ee;
  --accent-on:#ffffff;
  --shadow:0 1px 2px rgba(24,24,27,.05), 0 8px 24px -12px rgba(24,24,27,.14);
  --shadow-lg:0 12px 40px -12px rgba(24,24,27,.22);

  /* donut segments: one accent, stepped down to a tint and a neutral */
  --seg-a:#17654f;
  --seg-b:#7fb3a2;
  --seg-c:#dcdce0;

  /* trace rows: one neutral wash per chat role, stepped light to dark */
  --tr-system:rgba(24,24,27,.035);
  --tr-tool:rgba(24,24,27,.065);
  --tr-user:rgba(24,24,27,.10);
  --tr-assistant:rgba(24,24,27,.14);

  --ease:cubic-bezier(.16,1,.3,1);
  --font-sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  /* data and label face: numbers, times, roles, counts. Was a monospace stack. */
  --font-data:"Manrope","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#111113;
  --surface:#161619;
  --surface-2:#1f1f24;
  --panel:#131315;
  --raised:#1a1a1e;
  --border:#2a2a30;
  --border-2:#3a3a42;
  --text:#f4f4f5;
  --text-2:#a8a8b2;
  --text-3:#7b7b85;
  --accent:#3e9e7e;
  --accent-hover:#4fb08e;
  --accent-soft:#17261f;
  --accent-on:#07201a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 16px 48px -16px rgba(0,0,0,.8);

  --seg-a:#3e9e7e;
  --seg-b:#2b6d5a;
  --seg-c:#3a3a42;

  --tr-system:rgba(255,255,255,.035);
  --tr-tool:rgba(255,255,255,.065);
  --tr-user:rgba(255,255,255,.10);
  --tr-assistant:rgba(255,255,255,.14);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.55;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft);color:var(--text)}

/* two-line label stacks: these pairs are always title over subtitle */
.vrow-t,.vrow-d,.ti-title,.ti-meta,.uc-name,
.sc-t,.sc-d,.find-t,.find-b,.menu-item .md{display:block}

/* theme cross-fade on the surfaces that change colour */
.topbar,.sidebar,.main,.msg-bubble,.composer,.card,.row,.menu,.rside{
  transition:background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
}

/* ---------------------------------------------------------------- app shell */
.app{display:grid;grid-template-rows:56px 1fr;height:100dvh;overflow:hidden}
.body{display:flex;min-height:0;min-width:0;border-top:1px solid var(--border)}

/* ------------------------------------------------------------- top control bar */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 12px;background:var(--bg);
}
.tb-group{display:flex;align-items:center;gap:6px;min-width:0}
.tb-spacer{flex:1;min-width:8px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 2px;border-radius:var(--r-control)}
.brand-mark{
  width:24px;height:24px;flex:none;display:grid;place-items:center;
  border-radius:7px;background:var(--accent);color:var(--accent-on);
}
.brand-mark svg{width:15px;height:15px}
.brand-name{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.tb-div{width:1px;height:20px;background:var(--border-2);margin:0 4px;flex:none}
.crumb{display:flex;align-items:center;gap:5px;min-width:0;font-size:13px;color:var(--text-2)}
.crumb > i.ph{font-size:12px;color:var(--text-3);flex:none}
/* the title doubles as a conversation switcher */
.crumb-btn{
  display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:340px;
  height:28px;padding:0 7px 0 8px;border-radius:8px;
  transition:background-color .16s var(--ease);
}
.crumb-btn:hover,.crumb-btn[aria-expanded="true"]{background:var(--surface-2)}
.crumb-btn .crumb-last{
  font-size:13px;font-weight:550;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.crumb-btn .chev{font-size:9px;color:var(--text-3);flex:none;transition:transform .25s var(--ease)}
.crumb-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* chat-only controls on the right: trace switch + right sidebar toggle */
.tb-actions{display:flex;align-items:center;gap:6px}
.tb-actions[hidden]{display:none}
.tb-txt-btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:8px;font-size:12.5px;font-weight:550;color:var(--text-2);
  transition:background-color .16s var(--ease), color .16s var(--ease);
}
.tb-txt-btn i.ph{font-size:14px}
.tb-txt-btn:hover{background:var(--surface-2);color:var(--text)}
/* the sidebar glyph mirrored, so it reads as the right-hand panel */
.icon-btn.flip i.ph{transform:scaleX(-1)}

/* window controls, flush to the top-right corner */
.win-ctl{gap:0;margin-right:-12px}
.win-btn{
  width:44px;height:56px;display:grid;place-items:center;
  color:var(--text-2);
  transition:background-color .15s var(--ease), color .15s var(--ease);
}
.win-btn i.ph{font-size:15px}
.win-btn:hover{background:var(--surface-2);color:var(--text)}
.win-btn.close:hover{background:#c42b1c;color:#fff}

.icon-btn{
  width:32px;height:32px;flex:none;display:grid;place-items:center;
  border-radius:var(--r-control);color:var(--text-2);
  transition:background-color .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
}
.icon-btn i.ph{font-size:17px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.sm{width:26px;height:26px}
.icon-btn.sm i.ph{font-size:14px}

/* menus that expand upward, used by the composer toolbar */
.menu.pop{
  left:0;right:auto;top:auto;bottom:calc(100% + 8px);
  transform-origin:bottom left;transform:translateY(6px) scale(.97);
}
.menu.pop.open{transform:none}
/* menus that drop down from a trigger (condition selects, list filters) */
.menu.drop{left:0;right:auto;transform-origin:top left}
.menu.sm{width:214px}
.menu.lg{width:300px}
.menu-sep{height:1px;background:var(--border);margin:6px 4px 2px}
.menu-item.plain{align-items:center}
.menu-item.plain > i.ph{margin-top:0}
.menu-item.plain .mt{font-weight:500}
.menu-foot{
  font-size:11px;line-height:1.45;color:var(--text-3);
  padding:8px 10px 4px;margin-top:4px;border-top:1px solid var(--border);
}

/* segmented control inside the thinking-effort menu */
.seg{
  display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
  padding:3px;margin:0 5px 8px;background:var(--surface-2);border-radius:9px;
}
.seg-i{
  height:26px;border-radius:6px;font-size:12px;font-weight:550;color:var(--text-2);
  transition:background-color .18s var(--ease),color .18s var(--ease);
}
.seg-i:hover{color:var(--text)}
.seg-i.sel{background:var(--raised);color:var(--accent)}
.think-d{font-size:12px;line-height:1.5;color:var(--text-2);padding:0 10px 8px}
.think-meta{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);
  padding:7px 10px 4px;border-top:1px solid var(--border);margin:0 4px;
}
.think-meta i.ph{font-size:13px}

.avatar{
  width:30px;height:30px;flex:none;border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:11.5px;font-weight:650;letter-spacing:.02em;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);
}

/* dropdown menu */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 7px);right:0;z-index:40;width:272px;
  padding:6px;background:var(--raised);border:1px solid var(--border);
  border-radius:var(--r-card);box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;
  pointer-events:none;
  transition:opacity .2s var(--ease), transform .26s var(--ease);
}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 6px}
.menu-item{
  width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;
  padding:9px 10px;border-radius:9px;
  transition:background-color .16s var(--ease);
}
.menu-item:hover{background:var(--surface-2)}
.menu-item i.ph{font-size:16px;color:var(--text-3);margin-top:2px}
.menu-item.sel i.ph{color:var(--accent)}
.menu-item .mt{font-size:13px;font-weight:550;display:flex;align-items:center;gap:6px}
.menu-item .md{font-size:12px;color:var(--text-3);line-height:1.45}
.menu-item .tick{margin-left:auto;font-size:14px;color:var(--accent);opacity:0;transition:opacity .18s var(--ease)}
.menu-item.sel .tick{opacity:1}

/* -------------------------------------------------------------------- sidebar */
.sidebar{
  /* --sb-w is the single source of truth for the rail width: JS reads it back
     when it has to work out how much room is left over for other panes */
  --sb-w:268px;width:var(--sb-w);flex:none;display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-right:1px solid var(--border);overflow:hidden;
  transition:width .38s var(--ease), background-color .3s var(--ease), border-color .3s var(--ease);
}
.app.collapsed .sidebar{--sb-w:64px}
.sb-inner{display:flex;flex-direction:column;min-height:0;flex:1;padding:12px 10px 10px;width:var(--sb-w)}

.new-chat{
  display:flex;align-items:center;gap:9px;width:100%;height:38px;padding:0 11px;flex:none;
  background:var(--accent);color:var(--accent-on);border-radius:var(--r-control);
  font-size:13.5px;font-weight:600;
  transition:background-color .18s var(--ease), transform .12s var(--ease), box-shadow .18s var(--ease);
}
.new-chat:hover{background:var(--accent-hover)}
.new-chat:active{transform:scale(.98)}
.new-chat i.ph{font-size:15px}
.new-chat .kbd{margin-left:auto;font-family:var(--font-data);font-size:10.5px;opacity:.7;font-weight:500}

.sb-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:10px -4px 0;padding:0 4px}
.sb-scroll::-webkit-scrollbar{width:8px}
.sb-scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:2px solid transparent;background-clip:content-box}
.sb-scroll:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}

.nav{position:relative;display:flex;flex-direction:column;gap:1px}
.nav-ind{
  position:absolute;left:0;right:0;top:0;height:34px;border-radius:9px;
  background:var(--accent-soft);opacity:0;
  transition:transform .36s var(--ease), height .3s var(--ease), opacity .25s var(--ease);
  pointer-events:none;
}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;height:34px;padding:0 10px;
  border-radius:9px;color:var(--text-2);font-size:13.5px;font-weight:500;z-index:1;
  transition:color .2s var(--ease), background-color .18s var(--ease);
}
.nav-item i.ph{font-size:17px;flex:none;transition:color .2s var(--ease), transform .3s var(--ease)}
.nav-item span{white-space:nowrap;transition:opacity .2s var(--ease)}
.nav-item:hover{color:var(--text)}
.nav-item:hover i.ph{transform:translateX(1px)}
.nav-item.active{color:var(--accent);font-weight:600}
.nav-item .count{
  margin-left:auto;font-family:var(--font-data);font-size:11px;color:var(--text-3);
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 6px;line-height:16px;
}

.sb-sec{margin-top:18px}
.sb-sec-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px 7px;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);
}
.thread-item{
  position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:8px 10px;border-radius:9px;color:var(--text-2);
  transition:background-color .18s var(--ease), color .18s var(--ease);
}
.thread-item i.ph{font-size:16px;flex:none;color:var(--text-3);transition:color .2s var(--ease)}
.thread-item .ti-body{min-width:0;flex:1}
.thread-item .ti-title{
  font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.thread-item .ti-meta{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-item:hover{background:var(--surface-2)}
.thread-item.active{background:var(--surface-2)}
.thread-item.active i.ph{color:var(--accent)}
.thread-item.active::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:18px;border-radius:2px;background:var(--accent);
  animation:barIn .34s var(--ease) both;
}
@keyframes barIn{from{height:0;opacity:0}to{height:18px;opacity:1}}

.sb-foot{flex:none;padding-top:10px;margin-top:6px;border-top:1px solid var(--border)}
.uc-row{display:flex;align-items:center;gap:3px}
.user-card{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:7px 8px;
  border-radius:var(--r-control);
  transition:background-color .18s var(--ease);
}
.user-card:hover,.user-card[aria-expanded="true"]{background:var(--surface-2)}
.user-card .uc-body{min-width:0;flex:1}
.user-card .chev{font-size:9px;color:var(--text-3);flex:none;transition:transform .25s var(--ease)}
.user-card[aria-expanded="true"] .chev{transform:rotate(180deg)}
.user-card .uc-name{font-size:13px;font-weight:550;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* account menu, pinned above the user card but living outside the sidebar
   so the sidebar's overflow clip cannot cut it off */
.menu.user-menu{
  top:auto;right:auto;width:252px;
  transform-origin:bottom left;transform:translateY(6px) scale(.97);
}
.menu.user-menu.open{transform:none}
.um-balance{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;font-size:12.5px}
.um-balance .l{color:var(--text-2)}
.um-balance .v{font-family:var(--font-data);font-size:13.5px;font-weight:650;color:var(--text)}
.menu-item.um-row{align-items:center}
.menu-item.um-row > i.ph{margin-top:0}
.menu-item.um-row .mt{flex:1;font-weight:500}
.menu-item.um-danger .mt{color:#b4413c}
[data-theme="dark"] .menu-item.um-danger .mt{color:#e0796f}
.menu-item.um-danger:hover{background:rgba(180,65,60,.08)}
.switch{
  position:relative;flex:none;width:34px;height:20px;border-radius:var(--r-pill);
  background:var(--border-2);transition:background-color .22s var(--ease);
}
.switch .knob{
  position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.2);
  transition:transform .24s var(--ease);
}
.menu-item.on .switch{background:var(--accent)}
.menu-item.on .switch .knob{transform:translateX(14px)}
.sb-note{
  font-size:10.5px;color:var(--text-3);padding:8px 8px 2px;line-height:1.4;
  border-top:1px dashed var(--border);margin-top:6px;
}
/* collapsed behaviour */
.app.collapsed .sb-inner{width:var(--sb-w);padding-left:8px;padding-right:8px}
.app.collapsed .nav-item span,
.app.collapsed .nav-item .count,
.app.collapsed .new-chat span,
.app.collapsed .new-chat .kbd,
.app.collapsed .sb-sec-h,
.app.collapsed .thread-item .ti-body,
.app.collapsed .user-card .uc-body,
.app.collapsed .user-card .chev,
.app.collapsed .uc-row > .icon-btn,
.app.collapsed .sb-note,
.app.collapsed .sb-sec{display:none}
.app.collapsed .nav-item,.app.collapsed .new-chat{justify-content:center;padding:0}
.app.collapsed .user-card{justify-content:center;padding:0;flex:none}

/* ----------------------------------------------------------------- main pane */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);position:relative}
.thread{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.thread::-webkit-scrollbar{width:10px}
.thread::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.thread:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}
.thread-inner{max-width:792px;margin:0 auto;padding:30px 26px 16px}

/* --------------------------------------------------------- right sidebar
   Nothing here animates: it is either in the layout or out of it, and the
   grip writes a width on the element while it is dragged. */
.rside{
  flex:none;position:relative;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--border);
}
.rside[hidden]{display:none}
.rs-grip{
  position:absolute;left:-4px;top:0;bottom:0;width:9px;z-index:3;
  cursor:col-resize;touch-action:none;
}
.rs-grip::after{
  content:'';position:absolute;left:3px;top:0;bottom:0;width:2px;
  background:transparent;transition:background-color .15s var(--ease);
}
.rs-grip:hover::after,.rs-grip:focus-visible::after,.rs-grip.on::after{background:var(--accent)}
body.rs-resizing{cursor:col-resize;user-select:none}
body.rs-resizing *{cursor:col-resize !important}

.rs-head{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:12px 12px 12px 14px;border-bottom:1px solid var(--border);
}
.rs-head[hidden]{display:none}
.rs-kind{font-size:15px;color:var(--text-3)}
.rs-kind-t{font-size:13px;font-weight:600}

.rs-body{flex:1;min-height:0;overflow-y:auto;padding:18px}
.rs-body::-webkit-scrollbar{width:10px}
.rs-body::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.rs-body:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}

.rs-foot{
  flex:none;display:flex;justify-content:flex-end;gap:8px;
  padding:10px 12px;border-top:1px solid var(--border);background:var(--surface);
}
.rs-foot[hidden]{display:none}
.rs-foot .menu.pop{
  left:auto;right:0;transform-origin:bottom right;
  max-height:min(58vh,440px);overflow-y:auto;   /* the profile list is long */
}
.rs-foot .menu.pop::-webkit-scrollbar{width:10px}
.rs-foot .menu.pop::-webkit-scrollbar-thumb{
  background:var(--border-2);border-radius:99px;border:3px solid transparent;background-clip:content-box;
}
#rsPick .chev{font-size:10px;color:var(--text-3);transition:transform .25s var(--ease)}
#rsPick[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* first screen: pick which kind of document to read */
.rs-pick{height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px;padding-bottom:8%}
.rs-pick-btn{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  border-radius:var(--r-card);background:var(--raised);border:1px solid var(--border);
  font-size:15px;font-weight:550;text-align:left;
  transition:background-color .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease);
}
.rs-pick-btn i.ph{font-size:21px;color:var(--accent)}
.rs-pick-btn i.rs-pick-go{margin-left:auto;font-size:14px;color:var(--text-3)}
.rs-pick-btn:hover{background:var(--surface-2);border-color:var(--border-2)}
.rs-pick-btn:active{transform:scale(.985)}

/* nothing chosen yet */
.rs-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;padding-bottom:6%;
}
.rs-empty > i.ph{font-size:30px;color:var(--text-3)}
.rs-empty .t{font-size:13.5px;font-weight:600}
.rs-empty .d{font-size:12.5px;line-height:1.6;color:var(--text-3);max-width:250px}

/* the document being read: its own heading, then whatever the drawer renders */
.rs-doc-h{padding-bottom:14px;margin-bottom:2px;border-bottom:1px solid var(--border)}
.rs-doc-t{font-size:15px;font-weight:640;letter-spacing:-.01em}
.rs-doc-m{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:4px;font-size:12px;color:var(--text-3)}
.rs-doc .paper{padding:16px}
.rs-doc .sec{margin-top:18px}

/* ------------------------------------------------------- conversation trace
   Two columns: the event list on the left, dashboard over detail on the right.
   Every value here is mono, because a trace is read like a log. */
.trace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(268px,.62fr) 1fr;gap:14px;padding:14px 16px 16px}
.trace[hidden]{display:none}
.tr-left{display:flex;flex-direction:column;min-height:0;gap:12px}
.tr-right{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}

/* search and filter share one bar */
.tr-search{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:5px 6px 5px 11px;background:var(--raised);
  border:1px solid var(--border);border-radius:var(--r-control);
}
.tr-search > i.ph{font-size:14px;color:var(--text-3);flex:none}
.tr-search input{flex:1;min-width:0;border:0;background:transparent;font-size:12.5px;padding:5px 0}
.tr-search input:focus{outline:0}
.tr-search input::placeholder{color:var(--text-3)}
.tr-filter{
  display:inline-flex;align-items:center;gap:5px;flex:none;height:26px;padding:0 8px;
  border-radius:8px;font-size:12px;font-weight:550;color:var(--text-2);
  background:var(--surface-2);
  transition:background-color .16s var(--ease), color .16s var(--ease);
}
.tr-filter:hover{color:var(--text)}
.tr-filter.on{color:var(--accent)}
.tr-filter .chev{font-size:9px;color:var(--text-3);transition:transform .25s var(--ease)}
.tr-filter[aria-expanded="true"] .chev{transform:rotate(180deg)}
/* the button sits at the right end of the bar, so the menu opens leftwards */
.tr-search .menu.drop{left:auto;right:0;transform-origin:top right}

.tr-list{
  flex:1;min-height:0;overflow-y:auto;padding:6px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r-card);
}
.tr-list::-webkit-scrollbar{width:10px}
.tr-list::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.tr-list:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}
.trow{
  position:relative;width:100%;display:grid;grid-template-columns:92px minmax(0,1fr) 40px;gap:10px;align-items:center;
  padding:7px 9px;border-radius:9px;text-align:left;
  transition:box-shadow .16s var(--ease);
}
.trow:hover{box-shadow:inset 0 0 0 1px var(--border-2)}
/* the selection mark is a short line, not a full-height edge */
.trow.sel::before{
  content:'';position:absolute;left:1px;top:50%;width:2px;height:16px;
  transform:translateY(-50%);border-radius:1px;background:var(--accent);
}
/* the role wash sits behind the role label only, so stacked rows stay apart.
   Each role carries its icon, which costs the content column some width. */
.trow-role{
  justify-self:end;display:inline-flex;align-items:center;gap:5px;
  padding:2px 6px;border-radius:6px;
  font-family:var(--font-data);font-size:11px;color:var(--text-3);
  white-space:nowrap;
}
.trow-role i.ph{font-size:12px;flex:none}
.trow.role-system .trow-role{background:var(--tr-system)}
.trow.role-tool .trow-role{background:var(--tr-tool)}
.trow.role-user .trow-role{background:var(--tr-user)}
.trow.role-assistant .trow-role{background:var(--tr-assistant)}
.trow.sel .trow-role{color:var(--accent);font-weight:600}
.trow.sel .trow-txt{color:var(--text)}
/* the content fills whatever the two fixed columns leave, then ellipsises */
.trow-txt{font-family:var(--font-data);font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow-time{font-family:var(--font-data);font-size:11px;color:var(--text-3);white-space:nowrap}
.tr-none{font-size:12px;color:var(--text-3);text-align:center;padding:26px 12px;line-height:1.6}

/* dashboard: the conversation on the left, the token split on the right.
   Shared grid rows are what keeps the two columns on the same baselines:
   the title spans the first two rows, and the two meta lines sit on the rows
   the last two token rows use. */
.tr-dash{
  display:grid;container-type:inline-size;
  grid-template-columns:minmax(0,1fr) auto auto;
  grid-template-rows:auto auto auto auto;
  column-gap:18px;row-gap:7px;align-items:center;padding:15px 17px;
}
.tr-dash-t{grid-area:1 / 1 / 3 / 2;font-size:19px;font-weight:660;letter-spacing:-.015em;line-height:1.3}
.tr-meta{grid-column:1;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.tr-meta i.ph{font-size:13px;flex:none}
.tr-meta-1{grid-row:3}
.tr-meta-2{grid-row:4}
.tr-tok-head{
  grid-area:1 / 2;display:flex;align-items:baseline;gap:12px;
  font-size:12px;color:var(--text-3);padding-bottom:6px;border-bottom:1px solid var(--border);
}
.tr-tok-head b{font-family:var(--font-data);font-size:13.5px;font-weight:640;color:var(--text)}
.tr-dash .lg-r{grid-column:2;font-size:12px;white-space:nowrap}
.tr-tok-1{grid-row:2}
.tr-tok-2{grid-row:3}
.tr-tok-3{grid-row:4}
.pie{grid-area:1 / 3 / 5 / 4;align-self:center;display:block;width:104px;height:104px}
.pie .pie-seg{stroke:var(--raised);stroke-width:1.5}
.pie .pie-seg.seg-a{fill:var(--seg-a)}
.pie .pie-seg.seg-b{fill:var(--seg-b)}
.pie .pie-seg.seg-c{fill:var(--seg-c)}
.pie .pie-empty{fill:var(--surface-2);stroke:none}
/* in a narrow pane the numbers are worth more than the pie */
@container (max-width: 486px){
  .tr-dash{grid-template-columns:minmax(0,1fr) auto;column-gap:14px}
  .tr-dash .pie{display:none}
}

/* detail: a fixed bar, then one collapsible card per part */
.tr-detail{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0}
.tr-bar{
  flex:none;display:flex;align-items:center;gap:10px;padding:10px 15px;
  border-bottom:1px solid var(--border);background:var(--surface);
}
.tr-bar .r{font-family:var(--font-data);font-size:12px;font-weight:600;color:var(--accent)}
.tr-bar .t{font-family:var(--font-data);font-size:11.5px;color:var(--text-3)}
.tr-bar .k{margin-left:auto;font-family:var(--font-data);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.tr-parts{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:9px}
.tr-parts::-webkit-scrollbar{width:10px}
.tr-parts::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.tr-parts:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}
.pcard{border:1px solid var(--border);border-radius:var(--r-control);background:var(--raised);overflow:hidden}
.pcard-h{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;text-align:left}
.pcard-h .h{font-size:12.5px;font-weight:600}
.pcard-h .n{font-family:var(--font-data);font-size:11px;color:var(--text-3)}
.pcard-h .chev{margin-left:auto;font-size:10px;color:var(--text-3);transition:transform .25s var(--ease)}
.pcard.open .pcard-h .chev{transform:rotate(180deg)}
.pcard-b{display:none;padding:11px;border-top:1px solid var(--border);background:var(--panel)}
.pcard.open .pcard-b{display:block}
.pcode{margin:0;font-family:var(--font-data);font-size:11.5px;line-height:1.65;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.tr-detail-none{padding:34px 18px;text-align:center;font-size:12.5px;line-height:1.7;color:var(--text-3)}

/* view switch transition */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view-anim{animation:viewIn .4s var(--ease) both}

/* ------------------------------------------------------------- message items */
.msg{display:flex;gap:12px;margin-bottom:26px}
.msg.enter{animation:msgIn .48s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

.msg-a-mark{
  width:26px;height:26px;flex:none;margin-top:2px;border-radius:8px;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.msg-a-mark svg{width:13px;height:13px}
.msg-body{min-width:0;flex:1}
.msg-name{font-size:12px;font-weight:650;letter-spacing:.01em;margin-bottom:6px}
.msg.agent .msg-name{color:var(--text)}

.msg.user{justify-content:flex-end}
.msg.user .msg-body{flex:0 1 auto;max-width:78%}
.msg-bubble{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-card);padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;
}

.msg-text{overflow-wrap:anywhere}
.msg-text p{margin:0 0 10px}
.msg-text p:last-child{margin-bottom:0}
.caret{
  display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;
  background:var(--accent);border-radius:1.5px;animation:blink 1s steps(1,end) infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* agent content stagger */
.stag{animation:childIn .5s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes childIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* tool call cards */
.tool{
  display:flex;align-items:center;gap:11px;margin-top:12px;
  padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-card);
  background:var(--raised);
}
.tool i.ph{font-size:15px;color:var(--text-3);flex:none}
.tool .tl{font-size:12.5px;font-weight:550}
.tool .tm{font-family:var(--font-data);font-size:11px;color:var(--text-3);margin-left:auto;text-align:right;white-space:nowrap}
.tool .ok{color:var(--accent);font-size:14px;flex:none}

/* structured findings */
.find{margin-top:16px;border-top:1px solid var(--border)}
.find-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.find-n{
  font-family:var(--font-data);font-size:11px;color:var(--accent);flex:none;
  width:20px;height:20px;border-radius:6px;background:var(--accent-soft);
  display:grid;place-items:center;margin-top:1px;
}
.find-t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.find-b{font-size:13px;color:var(--text-2);line-height:1.55}

/* before / after rewrite */
.diff{margin-top:16px;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.diff-h{
  padding:8px 13px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);border-bottom:1px solid var(--border);background:var(--surface);
}
.diff-row{padding:12px 13px;display:flex;gap:11px;align-items:flex-start}
.diff-row + .diff-row{border-top:1px solid var(--border)}
.diff-tag{font-family:var(--font-data);font-size:10.5px;color:var(--text-3);flex:none;width:44px;padding-top:2px}
.diff-txt{font-size:13px;line-height:1.55}
.diff-row.before .diff-txt{color:var(--text-3)}
.diff-row.after{background:var(--accent-soft)}
.diff-row.after .diff-tag{color:var(--accent)}
.diff-row.after .diff-txt{color:var(--text);font-weight:500}

/* compact list of roles / items inside a message */
.rows{margin-top:14px;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.rows-item{display:flex;align-items:center;gap:12px;padding:11px 13px;transition:background-color .18s var(--ease)}
.rows-item + .rows-item{border-top:1px solid var(--border)}
.rows-item:hover{background:var(--surface)}
.rows-co{font-size:13px;font-weight:600;min-width:82px}
.rows-role{font-size:12.5px;color:var(--text-2);flex:1;min-width:0}
.rows-tag{
  font-family:var(--font-data);font-size:11px;color:var(--text-2);white-space:nowrap;
  background:var(--surface-2);border-radius:var(--r-pill);padding:2px 8px;
}
.rows-tag.soon{background:var(--accent-soft);color:var(--accent)}

/* suggestion chips under a message */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;
  border:1px solid var(--border);border-radius:var(--r-pill);background:var(--raised);
  font-size:12.5px;font-weight:500;color:var(--text-2);
  transition:background-color .18s var(--ease), border-color .2s var(--ease),
             color .18s var(--ease), transform .14s var(--ease);
}
.chip i.ph{font-size:13px;color:var(--text-3);transition:color .18s var(--ease)}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.chip:hover i.ph{color:var(--accent)}
.chip:active{transform:translateY(0) scale(.98)}

/* hover actions on a message */
.msg-actions{display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .22s var(--ease)}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}

/* typing indicator */
.typing{display:flex;gap:4px;align-items:center;height:22px}
.typing span{
  width:5px;height:5px;border-radius:50%;background:var(--text-3);
  animation:bounce .9s var(--ease) infinite;
}
.typing span:nth-child(2){animation-delay:.13s}
.typing span:nth-child(3){animation-delay:.26s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ----------------------------------------------------------------- empty state */
.empty{padding-top:44px;animation:viewIn .5s var(--ease) both}
.empty h1{font-size:26px;font-weight:640;letter-spacing:-.02em;margin:0 0 8px}
.empty p{margin:0 0 26px;color:var(--text-2);font-size:14px;max-width:56ch}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg-card{
  display:flex;gap:11px;align-items:flex-start;text-align:left;padding:14px;
  border:1px solid var(--border);border-radius:var(--r-card);background:var(--raised);
  transition:border-color .2s var(--ease),background-color .2s var(--ease),transform .16s var(--ease);
}
.sugg-card:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.sugg-card:active{transform:translateY(0)}
.sugg-card i.ph{font-size:17px;color:var(--accent);flex:none;margin-top:1px}
.sugg-card .sc-t{font-size:13px;font-weight:600;margin-bottom:2px}
.sugg-card .sc-d{font-size:12px;color:var(--text-2);line-height:1.45}

/* ------------------------------------------------------------------- composer */
.composer-wrap{flex:none;padding:0 26px 18px;background:linear-gradient(to bottom, transparent, var(--panel) 22%)}
.composer-col{max-width:792px;margin:0 auto}

.ctx{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.ctx-item{
  display:inline-flex;align-items:center;gap:6px;padding:4px 5px 4px 10px;
  border:1px solid var(--border);border-radius:var(--r-pill);background:var(--raised);
  font-size:11.5px;color:var(--text-2);
  animation:childIn .34s var(--ease) both;
}
.ctx-item i.ph{font-size:12px;color:var(--text-3)}
/* a chip that points at a document opens it in the right sidebar */
.ctx-open{
  padding:0;font-size:11.5px;color:var(--text-2);border-radius:4px;
  transition:color .16s var(--ease);
}
.ctx-open:hover{color:var(--text)}
.ctx-x{
  width:18px;height:18px;display:grid;place-items:center;border-radius:var(--r-pill);
  color:var(--text-3);transition:background-color .16s var(--ease),color .16s var(--ease);
}
.ctx-x:hover{background:var(--surface-2);color:var(--text)}
.ctx-item.leaving{animation:chipOut .24s var(--ease) both}
@keyframes chipOut{to{opacity:0;transform:scale(.9);margin-right:-6px}}

.composer{
  display:block;padding:9px 9px 7px 12px;
  border:1px solid var(--border-2);border-radius:var(--r-card);background:var(--raised);
  box-shadow:var(--shadow);
  transition:border-color .2s var(--ease), box-shadow .25s var(--ease), background-color .3s var(--ease);
}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{
  display:block;width:100%;min-height:24px;max-height:150px;resize:none;border:0;outline:0;background:none;
  padding:4px 2px 2px;font-size:14px;line-height:1.5;
}
.composer textarea::placeholder{color:var(--text-3)}

/* toolbar row, inside the box, under the textarea */
.cmp-bar{display:flex;align-items:center;gap:4px;margin-top:6px}
.cmp-tools{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.cmp-right{display:flex;align-items:center;gap:4px;flex:none}
.cmp-btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;
  border-radius:8px;color:var(--text-2);font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background-color .16s var(--ease),color .16s var(--ease),transform .12s var(--ease);
}
.cmp-btn i.ph{font-size:15px;flex:none}
.cmp-btn:hover{background:var(--surface-2);color:var(--text)}
.cmp-btn:active{transform:scale(.97)}
.cmp-btn[aria-expanded="true"]{background:var(--surface-2);color:var(--text)}
.cmp-btn.accent{color:var(--text)}
.cmp-btn.accent i.ph{color:var(--accent)}
.cmp-btn .chev{font-size:10px;color:var(--text-3);transition:transform .25s var(--ease)}
.cmp-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cmp-btn.icon-only{width:28px;padding:0;justify-content:center}

/* context usage ring, with a hover detail panel */
.ctx-wrap{position:relative;display:flex;align-items:center;flex:none}
.ctx-ring{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px 0 4px;
  border-radius:8px;transition:background-color .18s var(--ease);
}
.ctx-ring:hover,.ctx-ring:focus-visible{background:var(--surface-2)}
.ctx-ring svg{width:22px;height:22px;flex:none;transform:rotate(-90deg)}
.ctx-ring .track{fill:none;stroke:var(--border-2);stroke-width:2.6}
.ctx-ring .val{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ctx-pct{font-family:var(--font-data);font-size:10.5px;color:var(--text-3);transition:color .18s var(--ease)}
.ctx-ring:hover .ctx-pct{color:var(--text-2)}

.ctx-pop{
  position:absolute;bottom:calc(100% + 10px);right:0;z-index:45;width:268px;padding:13px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(6px) scale(.97);transform-origin:bottom right;pointer-events:none;
  transition:opacity .2s var(--ease), transform .26s var(--ease);
}
.ctx-pop::before{content:"";position:absolute;left:0;right:0;top:100%;height:12px}
.ctx-wrap:hover .ctx-pop,.ctx-wrap:focus-within .ctx-pop{opacity:1;transform:none;pointer-events:auto}
.cp-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px}
.cp-big{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.cp-big #cpPct{font-family:var(--font-data);font-size:22px;font-weight:640;letter-spacing:-.02em}
.cp-big #cpTok{font-family:var(--font-data);font-size:11px;color:var(--text-3)}
.cp-rows{display:grid;gap:7px;margin-bottom:10px}
.cp-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-2)}
.cp-row b{font-family:var(--font-data);font-size:11.5px;font-weight:500;color:var(--text)}
.cp-row.dim{padding-top:8px;border-top:1px solid var(--border);color:var(--text-3)}
.cp-row.dim b{color:var(--text-3)}
.cp-cache{padding-top:9px;border-top:1px solid var(--border)}
.cp-cache-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:550}
.cp-cache-h span{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);font-weight:500}
.cp-cache-h i.ph{font-size:13px;color:var(--accent)}
.cp-cache-h b{font-family:var(--font-data);font-size:12px;color:var(--accent)}
.cp-cache-d{font-size:11.5px;line-height:1.45;color:var(--text-3);margin-top:4px}

.send{
  width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:var(--r-control);
  background:var(--accent);color:var(--accent-on);
  transition:background-color .18s var(--ease),transform .12s var(--ease),opacity .2s var(--ease);
}
.send i.ph{font-size:16px}
.send:hover{background:var(--accent-hover)}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none}
.composer-foot{
  display:flex;align-items:center;gap:10px;padding:7px 3px 0;font-size:11px;color:var(--text-3);
}
.composer-foot .sep{flex:1}
.kbd-hint{font-family:var(--font-data);font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:0 4px;background:var(--surface)}

/* ------------------------------------------------------------- static views */
.view{padding:34px 34px 40px;max-width:960px;margin:0 auto}
.view-h{display:flex;align-items:flex-end;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:6px}
.view-h h1{font-size:21px;font-weight:640;letter-spacing:-.015em;margin:0}
.view-h p{margin:3px 0 0;font-size:13px;color:var(--text-2);max-width:62ch}
.view-h .vh-act{margin-left:auto;display:flex;gap:8px}
.ghost-btn{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--r-control);font-size:12.5px;font-weight:550;color:var(--text-2);
  transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.ghost-btn:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--text)}
.vrow{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:var(--r-control);transition:background-color .18s var(--ease)}
.vrow:hover{background:var(--surface)}
.vrow + .vrow{border-top:1px solid var(--border)}
.vrow-main{min-width:0;flex:1}
.vrow-t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow-d{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{
  font-family:var(--font-data);font-size:11px;padding:2px 8px;border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--text-2);white-space:nowrap;
}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.vgroup-h{
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  padding:20px 12px 4px;
}
/* clickable list rows open a detail drawer */
.vrow.clickable{width:100%;text-align:left}
.vrow-go{font-size:13px;color:var(--text-3);flex:none;transition:transform .2s var(--ease),color .2s var(--ease)}
.vrow.clickable:hover .vrow-go{color:var(--accent);transform:translateX(2px)}
.btn-accent{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;
  border-radius:var(--r-control);background:var(--accent);color:var(--accent-on);
  font-size:12.5px;font-weight:600;
  transition:background-color .18s var(--ease),transform .12s var(--ease);
}
.btn-accent:hover{background:var(--accent-hover)}
.btn-accent:active{transform:scale(.98)}
.btn-accent:disabled{background:var(--surface-2);color:var(--text-3);cursor:default;transform:none}

/* ---------------------------------------------------------- detail drawer */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(24,24,27,.36);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
[data-theme="dark"] .scrim{background:rgba(0,0,0,.56)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(500px,92vw);
  display:flex;flex-direction:column;background:var(--panel);
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);
  transform:translateX(102%);visibility:hidden;
  transition:transform .38s var(--ease), visibility 0s linear .38s,
             background-color .3s var(--ease), border-color .3s var(--ease);
}
.drawer.show{transform:none;visibility:visible;transition:transform .38s var(--ease), visibility 0s}
.dw-head{flex:none;display:flex;align-items:flex-start;gap:12px;padding:15px 16px 14px 18px;border-bottom:1px solid var(--border)}
.dw-title{font-size:15px;font-weight:640;letter-spacing:-.01em}
.dw-meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:4px;font-size:12px;color:var(--text-3)}
.dw-body{flex:1;min-height:0;overflow-y:auto;padding:18px}
.dw-body::-webkit-scrollbar{width:10px}
.dw-body::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.dw-body:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}
.dw-foot{flex:none;display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface)}

/* the resume itself: plain on purpose */
.note{
  display:flex;gap:9px;padding:10px 12px;margin-bottom:16px;
  background:var(--accent-soft);border-radius:var(--r-control);
  font-size:12.5px;line-height:1.55;
}
.note i.ph{font-size:15px;color:var(--accent);flex:none;margin-top:1px}
.paper{border:1px solid var(--border);border-radius:var(--r-card);padding:20px;background:var(--raised)}
.paper-name{font-size:19px;font-weight:660;letter-spacing:-.01em}
.paper-role{font-size:13px;color:var(--text-2);margin-top:3px}
.paper-contact{display:flex;flex-wrap:wrap;gap:7px 15px;margin-top:13px;padding-top:13px;border-top:1px solid var(--border)}
.paper-contact span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.paper-contact i.ph{font-size:13px;color:var(--text-3)}
.paper-sum{margin-top:14px;font-size:13px;line-height:1.65;color:var(--text-2)}
.sec{margin-top:22px}
.sec-h{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding-bottom:7px;border-bottom:1px solid var(--border)}
.job{padding:12px 0}
.job + .job{border-top:1px solid var(--border)}
.job-t{font-size:13.5px;font-weight:600}
.job-s{font-size:12px;color:var(--text-3);margin-top:2px}
.job ul{margin:8px 0 0;padding-left:17px}
.job li{font-size:13px;line-height:1.6;color:var(--text-2);margin-bottom:5px}
.job li:last-child{margin-bottom:0}
.skill-txt{font-size:13px;line-height:1.65;color:var(--text-2);padding-top:11px}

/* ------------------------------------------------------- applications board */
.view.wide{max-width:1180px}
.dash{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;padding-top:18px}
.panel{border:1px solid var(--border);border-radius:var(--r-card);background:var(--raised);padding:16px}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panel-t{font-size:13.5px;font-weight:600}
.panel-s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.panel-num{display:flex;align-items:baseline;gap:3px;font-family:var(--font-data)}
.panel-num b{font-size:22px;font-weight:640;letter-spacing:-.02em}
.panel-num span{font-size:11px;color:var(--text-3)}

/* seven day line chart */
.chart-wrap{position:relative;margin-top:8px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--text-3);font-family:var(--font-data);font-size:10px}
.chart .area{fill:url(#areaFill);opacity:0;animation:areaIn .7s var(--ease) .3s forwards}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--raised);stroke:var(--accent);stroke-width:1.8;opacity:0;animation:dotIn .34s var(--ease) forwards}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .tip-line{stroke:var(--border-2);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s var(--ease)}
.chart .tip-dot{fill:var(--accent);stroke:var(--raised);stroke-width:2;opacity:0;transition:opacity .15s var(--ease)}
.chart-wrap.hot .tip-line,.chart-wrap.hot .tip-dot{opacity:1}
.g-stop-0{stop-color:var(--accent);stop-opacity:.2}
.g-stop-1{stop-color:var(--accent);stop-opacity:0}
@keyframes areaIn{to{opacity:1}}
@keyframes dotIn{to{opacity:1}}
.chart-tip{
  position:absolute;z-index:2;pointer-events:none;padding:5px 9px;border-radius:8px;
  background:var(--text);color:var(--bg);font-family:var(--font-data);font-size:11.5px;white-space:nowrap;
  transform:translate(-50%,-146%);opacity:0;transition:opacity .15s var(--ease);
}
.chart-wrap.hot .chart-tip{opacity:1}

/* progress donut */
.donut-wrap{position:relative;display:grid;place-items:center;margin:6px 0 2px}
.donut{display:block;width:158px;height:158px}
.seg-arc{fill:none;stroke-width:13}
.seg-a{stroke:var(--seg-a)}
.seg-b{stroke:var(--seg-b)}
.seg-c{stroke:var(--seg-c)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-c b{display:block;font-family:var(--font-data);font-size:24px;font-weight:640;letter-spacing:-.02em;line-height:1.15}
.donut-c span{font-size:11px;color:var(--text-3)}
.legend{display:grid;gap:8px;margin-top:12px}
.lg-r{display:flex;align-items:center;gap:9px;font-size:12.5px}
.lg-swatch{width:9px;height:9px;border-radius:3px;flex:none}
.sw-a{background:var(--seg-a)}
.sw-b{background:var(--seg-b)}
.sw-c{background:var(--seg-c)}
.lg-t{color:var(--text-2)}
.lg-n{margin-left:auto;font-family:var(--font-data);font-size:11.5px;color:var(--text-3)}
.lg-n b{color:var(--text);font-weight:550}

/* stage columns with draggable cards */
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.col{display:flex;flex-direction:column;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.col-t{font-size:13px;font-weight:600}
.col-n{font-family:var(--font-data);font-size:11px;color:var(--text-3);background:var(--surface-2);border-radius:var(--r-pill);padding:1px 7px}
.col-body{
  display:flex;flex-direction:column;gap:9px;min-height:156px;padding:9px;
  border:1px dashed var(--border);border-radius:var(--r-card);background:var(--surface);
  transition:border-color .18s var(--ease),background-color .18s var(--ease);
}
.col-body.over{border-color:var(--accent);background:var(--accent-soft)}
.col-empty{font-size:11.5px;color:var(--text-3);text-align:center;padding:24px 0}
.acard{
  border:1px solid var(--border);border-radius:var(--r-control);background:var(--raised);
  padding:11px 12px;cursor:grab;text-align:left;
  transition:border-color .18s var(--ease),box-shadow .2s var(--ease),transform .14s var(--ease),opacity .18s var(--ease);
}
.acard:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
.acard:active{cursor:grabbing}
.acard.dragging{opacity:.45;border-style:dashed}
.ac-top{display:flex;align-items:center;gap:6px}
.ac-co{font-size:13.5px;font-weight:600}
.ac-flag{margin-left:auto;display:inline-flex;font-size:13px;color:var(--accent)}
.ac-role{font-size:12.5px;color:var(--text-2);margin-top:3px}
.ac-meta{font-family:var(--font-data);font-size:11px;color:var(--text-3);margin-top:8px}
.ac-next{font-size:11.5px;color:var(--text-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.ac-next.urgent{color:var(--accent);font-weight:500}

/* drawer: key/value rows, timeline, stage switch */
.kv{display:grid;gap:10px;padding-top:13px}
.kv-r{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--text-2)}
.kv-r b{font-weight:550;color:var(--text);text-align:right}
.tl{padding-top:13px}
.tl-r{position:relative;display:flex;gap:10px;padding:0 0 13px 20px}
.tl-r:last-child{padding-bottom:0}
.tl-r::before{content:"";position:absolute;left:5px;top:14px;bottom:-1px;width:1px;background:var(--border)}
.tl-r:last-child::before{display:none}
.tl-r::after{content:"";position:absolute;left:1px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--raised);border:1.5px solid var(--accent)}
.tl-d{font-family:var(--font-data);font-size:11px;color:var(--text-3);width:34px;flex:none}
.tl-t{flex:1;font-size:12.5px;line-height:1.5;color:var(--text-2)}
.note.plain{background:var(--surface-2)}
.note.plain i.ph{color:var(--text-3)}
.foot-label{margin-left:auto;align-self:center;font-size:11.5px;color:var(--text-3)}
.stage-seg{display:flex;gap:3px;padding:3px;background:var(--surface-2);border-radius:9px}
.stage-seg .seg-i{padding:0 10px}

/* ---------------------------------------------------------------- job library */
.joblib .cond{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;
  gap:10px;align-items:end;margin-top:18px;
}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding-left:1px}
.field input{
  height:32px;padding:0 10px;border:1px solid var(--border-2);border-radius:8px;
  background:var(--panel);font-size:12.5px;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
.field input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input::placeholder{color:var(--text-3)}
.sel-btn{
  display:flex;align-items:center;gap:6px;width:100%;height:32px;padding:0 9px;
  border:1px solid var(--border-2);border-radius:8px;background:var(--panel);
  font-size:12.5px;color:var(--text);
  transition:background-color .16s var(--ease),border-color .18s var(--ease);
}
.sel-btn:hover{background:var(--surface-2)}
.sel-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel-btn .v{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-btn .chev{font-size:10px;color:var(--text-3);flex:none;transition:transform .25s var(--ease)}
.sel-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cond-go{height:32px;white-space:nowrap}

.jlib{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.15fr);gap:14px;margin-top:14px;align-items:start}
.jlib .panel{padding:14px}
/* the search + filter bar is one integrated control */
.jsearch{
  display:flex;align-items:center;gap:8px;padding:0 6px 0 11px;
  border:1px solid var(--border-2);border-radius:var(--r-control);background:var(--panel);
  transition:border-color .2s var(--ease);
}
.jsearch:focus-within{border-color:var(--accent)}
.jsearch > i.ph{font-size:15px;color:var(--text-3);flex:none}
.jsearch input{flex:1;min-width:0;height:32px;border:0;outline:0;background:none;font-size:13px}
.jsearch input::placeholder{color:var(--text-3)}
.jsearch .sep-v{width:1px;height:18px;background:var(--border);flex:none}
.filter-btn{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;flex:none;
  border:1px solid var(--border);border-radius:7px;font-size:12.5px;color:var(--text-2);
  transition:background-color .16s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.filter-btn:hover{background:var(--surface-2);color:var(--text)}
.filter-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.filter-btn i.ph{font-size:14px}
.filter-btn .chev{font-size:9px;transition:transform .25s var(--ease)}
.filter-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}

.jrows{display:flex;flex-direction:column;gap:6px;margin-top:11px;max-height:600px;overflow-y:auto;margin-right:-4px;padding-right:4px}
.jrows::-webkit-scrollbar{width:9px}
.jrows::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.jrows:hover::-webkit-scrollbar-thumb{background:var(--border-2);background-clip:content-box}
.jrow{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;text-align:left;
  border:1px solid transparent;border-radius:var(--r-control);
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
.jrow:hover{background:var(--surface-2)}
.jrow.active{background:var(--accent-soft);border-color:var(--accent)}
.jr-main{min-width:0;flex:1}
.jr-co{display:block;font-size:13.5px;font-weight:600}
.jr-role{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.jtag{
  font-family:var(--font-data);font-size:10.5px;color:var(--text-2);
  background:var(--surface-2);border-radius:var(--r-pill);padding:1px 7px;white-space:nowrap;
}
.jrow.active .jtag{background:var(--raised)}
.jrow-empty{font-size:12.5px;color:var(--text-3);text-align:center;padding:30px 0}

/* the score ring: the loudest thing in the row, on purpose */
.ring-wrap{position:relative;flex:none;display:grid;place-items:center}
.ring-wrap.w-row{width:38px;height:38px}
.ring-wrap.w-detail{width:48px;height:48px}
.mini-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.mini-ring .mr-track{fill:none;stroke:var(--border-2);stroke-width:3}
.mini-ring .mr-val{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.jr-num{position:relative;font-family:var(--font-data);font-size:12.5px;font-weight:650;letter-spacing:-.03em;color:var(--accent)}
.ring-wrap.w-detail .jr-num{font-size:14px}

/* detail side */
.jd-head{display:flex;align-items:center;gap:12px}
.jd-title{flex:1;min-width:0}
.jd-co{font-size:16px;font-weight:660;letter-spacing:-.015em}
.jd-role{font-size:12.5px;color:var(--text-2);margin-top:3px}
/* 收藏 and 编辑 ride in the head, right-aligned on the score's centre line */
.jd-actions{display:flex;gap:8px;flex:none}
.jd-actions .ghost-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.jd-blk + .jd-blk{margin-top:16px}
.jd-h{font-size:12.5px;font-weight:600;margin-bottom:7px}
.jd-p{margin:0;font-size:13px;line-height:1.7;color:var(--text-2)}
.jd-ul{margin:0;padding-left:17px}
.jd-ul li{font-size:13px;line-height:1.65;color:var(--text-2);margin-bottom:6px}
.jd-ul li:last-child{margin-bottom:0}
.jd-text{font-size:13px;line-height:1.7;color:var(--text-2);white-space:pre-wrap}
.jd-edit{display:grid;gap:9px}
.jd-edit textarea{
  min-height:230px;padding:11px;border:1px solid var(--border-2);border-radius:var(--r-control);
  background:var(--panel);font-size:12.5px;line-height:1.65;resize:vertical;
}
.jd-edit textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.jd-edit-row{display:flex;gap:8px;justify-content:flex-end}
.jd-empty{font-size:12.5px;color:var(--text-3);text-align:center;padding:60px 20px;line-height:1.7}

/* -------------------------------------------------------------------- toast */
.toast{
  position:fixed;left:50%;bottom:26px;z-index:80;
  display:flex;align-items:center;gap:9px;padding:9px 15px;
  background:var(--text);color:var(--bg);border-radius:var(--r-pill);
  font-size:12.5px;font-weight:500;box-shadow:var(--shadow-lg);
  opacity:0;transform:translate(-50%,10px);pointer-events:none;
  transition:opacity .25s var(--ease), transform .32s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i.ph{font-size:14px}

/* -------------------------------------------------------- reduced motion mode */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .caret{animation:none}
}
@media (max-width:1080px){
  .sidebar{--sb-w:220px}
  .crumb-btn{max-width:170px}
  .joblib .cond{grid-template-columns:repeat(3,minmax(0,1fr))}
  .joblib .cond-go{grid-column:1/-1;justify-self:end}
}
@media (max-width:860px){
  .sugg{grid-template-columns:1fr}
  .dash,.pipe,.jlib{grid-template-columns:1fr}
  .thread-inner,.composer-wrap{padding-left:16px;padding-right:16px}
}

/* ============================================================================
   SETTINGS PAGE (avery-settings.html)
   ---------------------------------------------------------------------------
   The settings page links the same stylesheet as the workspace, so tokens,
   buttons, menus and the account menu stay identical. Only the pieces below
   are settings-specific. Same shape rule, same palette, same motion policy:
   a pane swap, a row leaving, a refresh spin. Nothing else moves.
   ============================================================================ */

/* breadcrumb leaf with no menu behind it */
.crumb > b{font-size:13px;font-weight:550;color:var(--text);white-space:nowrap}

/* the primary rail button is a link back to the workspace */
a.new-chat{text-decoration:none}

.set{padding:34px 30px 46px;max-width:1120px;margin:0 auto}

.set-head{display:flex;align-items:flex-end;gap:18px}
.set-head h1{margin:0;font-size:30px;font-weight:680;letter-spacing:-.025em;line-height:1.15}
.set-head p{margin:7px 0 0;font-size:13.5px;color:var(--text-2);max-width:72ch}
.set-refresh{margin-left:auto;color:var(--text-3)}
.set-refresh:hover{color:var(--text)}
.set-refresh.spin i.ph{animation:spin .6s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}

/* the card is the page: provider list left, one supplier's config right */
.set-card{
  display:grid;grid-template-columns:290px minmax(0,1fr);
  margin-top:20px;border:1px solid var(--border);border-radius:var(--r-card);
  background:var(--raised);
  transition:background-color .3s var(--ease), border-color .3s var(--ease);
}
.set-side{
  padding:14px 10px;border-right:1px solid var(--border);background:var(--surface);
  border-radius:calc(var(--r-card) - 1px) 0 0 calc(var(--r-card) - 1px);
  transition:background-color .3s var(--ease), border-color .3s var(--ease);
}
.set-group{font-size:12px;font-weight:600;color:var(--text-3);padding:14px 10px 6px}
.set-group:first-child{padding-top:2px}

.prov{
  display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;
  border:1px solid transparent;border-radius:var(--r-control);text-align:left;
  font-size:13.5px;font-weight:550;color:var(--text-2);
  transition:background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
}
.prov i.ph{font-size:17px;flex:none;color:var(--text-3);transition:color .18s var(--ease)}
.prov .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--border-2);transition:background-color .2s var(--ease)}
.prov .dot.on{background:var(--accent)}
.prov:hover{background:var(--surface-2);color:var(--text)}
.prov.sel{background:var(--raised);border-color:var(--border-2);color:var(--text);font-weight:600}
.prov.sel i.ph{color:var(--accent)}
.prov-add{
  display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;margin-top:2px;
  border-radius:var(--r-control);text-align:left;font-size:13.5px;font-weight:550;color:var(--text-2);
  transition:background-color .16s var(--ease), color .16s var(--ease);
}
.prov-add i.ph{font-size:17px;flex:none;color:var(--text-3)}
.prov-add:hover{background:var(--surface-2);color:var(--text)}

.set-pane{display:flex;flex-direction:column;gap:22px;padding:22px 26px 28px;min-width:0}
.set-d-head{display:flex;align-items:center;gap:9px;min-width:0}
.set-name{font-size:20px;font-weight:660;letter-spacing:-.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-name-inp{
  height:34px;width:240px;max-width:100%;padding:0 9px;
  border:1px solid var(--accent);border-radius:8px;background:var(--panel);
  font-size:17px;font-weight:640;letter-spacing:-.01em;
}
.set-name-inp:focus{outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.pill{
  display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:600;white-space:nowrap;flex:none;
}
.pill.on{background:var(--accent);color:var(--accent-on)}
.pill.off{background:var(--surface-2);color:var(--text-3)}
.pill-btn{
  display:inline-flex;align-items:center;height:26px;padding:0 12px;flex:none;
  border:1px solid var(--border);border-radius:var(--r-pill);
  font-size:12.5px;font-weight:600;color:var(--text-2);
  transition:background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
}
.pill-btn:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--text)}
.set-del{margin-left:auto;color:var(--text-3)}
.set-del:hover{background:rgba(180,65,60,.08);color:#b4413c}
[data-theme="dark"] .set-del:hover{color:#e0796f}

.set-fields{display:flex;flex-direction:column;gap:17px;min-width:0}
.set-field{display:flex;flex-direction:column;gap:7px;min-width:0}
.set-field > .lb{font-size:12.5px;font-weight:550;color:var(--text-2);padding-left:1px}
.set-inp{
  width:100%;height:40px;padding:0 12px;
  border:1px solid var(--border-2);border-radius:var(--r-control);
  background:var(--panel);font-size:13.5px;color:var(--text);
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background-color .3s var(--ease);
}
.set-inp::placeholder{color:var(--text-3)}
.set-inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-wrap{position:relative;display:flex;align-items:center;min-width:0}
.inp-wrap .set-inp{padding-right:44px}
.inp-eye{
  position:absolute;right:5px;width:30px;height:30px;display:grid;place-items:center;
  border-radius:8px;color:var(--text-3);
  transition:background-color .16s var(--ease), color .16s var(--ease);
}
.inp-eye i.ph{font-size:16px}
.inp-eye:hover{background:var(--surface-2);color:var(--text)}

/* the API format picker reuses the app's select control, one size larger */
.set-pane .sel-btn{height:40px;padding:0 12px;font-size:13.5px}
.set-pane .sel-btn .chev{font-size:11px}
.set-pane .menu.drop{left:0;right:0;width:100%}

.set-models{
  border:1px solid var(--border);border-radius:var(--r-card);background:var(--panel);
  transition:background-color .3s var(--ease), border-color .3s var(--ease);
}
.mrow{display:flex;align-items:center;gap:9px;padding:9px 10px 9px 14px;min-width:0}
.mrow + .mrow{border-top:1px solid var(--border)}
.mrow:hover{background:var(--surface)}
.mrow-name{flex:1;min-width:0;font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow-chips{display:flex;gap:5px;flex:none}
.mrow-acts{display:flex;gap:1px;flex:none}
.mrow .icon-btn.sm{color:var(--text-3)}
.mrow .icon-btn.sm:hover{color:var(--text)}
.mrow .icon-btn.sm.def{color:var(--accent)}
.mrow-empty{padding:20px 14px;font-size:12.5px;color:var(--text-3);text-align:center}
.mrow.enter{animation:rowIn .3s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mrow.leaving{animation:rowOut .2s var(--ease) both}
@keyframes rowOut{to{opacity:0;transform:translateX(-8px)}}

.quiet-btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  border-radius:var(--r-control);background:var(--surface-2);
  font-size:13px;font-weight:550;color:var(--text-2);
  transition:background-color .16s var(--ease), color .16s var(--ease), transform .12s var(--ease);
}
.quiet-btn i.ph{font-size:15px}
.quiet-btn:hover{background:var(--border);color:var(--text)}
.quiet-btn:active{transform:scale(.98)}
.set-add{align-self:flex-start}
.set-empty{padding:60px 20px;text-align:center;font-size:13px;color:var(--text-3);line-height:1.7}
